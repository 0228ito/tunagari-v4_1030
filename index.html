    const simGrams = (t) => { const s = String(t || "").replace(SIM_STOP, ""); const g = new Set(); for (let i = 0; i < s.length - 1; i++) g.add(s.slice(i, i + 2)); return g; };

    const INPUT = "w-full bg-sunk text-ink placeholder:text-mute rounded-2xl px-4 py-3 text-[14px] outline-none border border-transparent focus:border-brand focus:bg-surface transition-colors";
    const BTN_PRIMARY = "bg-brand text-on-brand font-black rounded-2xl py-3.5 text-[15px] tracking-wide shadow-soft press disabled:opacity-50";
    const BTN_SOFT = "bg-sunk text-ink font-bold rounded-2xl py-3 text-[14px] press";
    const LABEL = "block text-[12px] font-bold text-sub mb-1.5";
    const CHIP = (on) => cx("px-3 py-1.5 rounded-full text-[12.5px] font-bold whitespace-nowrap flex-shrink-0 flex items-center gap-1 press border", on ? "bg-brand text-on-brand border-brand" : "bg-surface text-sub border-line");

    let _scrollLocks = 0;
    function useScrollLock() {
      useEffect(() => {
        const html = document.documentElement, body = document.body;
        if (_scrollLocks++ === 0) { html.style.overflow = "hidden"; body.style.overflow = "hidden"; html.style.overscrollBehavior = "none"; }
        return () => { if (--_scrollLocks === 0) { html.style.overflow = ""; body.style.overflow = ""; html.style.overscrollBehavior = ""; } };
      }, []);
    }

    function Icon({ n, fill, size, className }) {
      return <span className={cx("ms", fill && "fill", className)} style={size ? { fontSize: size } : undefined} aria-hidden="true">{n}</span>;
    }

    function Avatar({ user, size = 40 }) {
      const anon = !user || user.anon;
      const text = anon ? null : `${String(user.fac || "").charAt(0)}${user.grade >= 5 ? "院" : user.grade}`;
      return (
        <div className={cx("rounded-full flex items-center justify-center font-head font-black flex-shrink-0", anon ? "bg-sunk text-mute" : "bg-sunk text-sub")}
          style={{ width: size, height: size, fontSize: size * 0.36 }} aria-hidden="true">
          {anon ? <Icon n="person" fill size={size * 0.55} /> : text}
        </div>
      );
    }

    function CategoryChip({ cat }) {
      const m = catMeta(cat);
      return <span className="bg-brand-tint text-brand-deep text-[12px] font-bold px-2.5 py-0.5 rounded-full inline-flex items-center gap-1"><Icon n={m.icon} fill size={13} />{m.short}</span>;
    }
    function MineBadge({ type, className }) {
      return (
        <span className={cx("inline-flex items-center gap-0.5 bg-brand-tint text-brand-deep text-[11px] font-black px-2 py-0.5 rounded-full", className)}>
          <Icon n="person" fill size={13} />{type === "answer" ? "あなたの回答" : "あなたの質問"}
        </span>
      );
    }
    function SolvedBadge({ recruit }) {
      return (
        <span className="inline-flex items-center gap-0.5 border border-brand text-brand-deep text-[11px] font-black px-2 py-[1px] rounded-full">
          <Icon n="check_circle" fill size={13} />{recruit ? "募集終了" : "解決済み"}
        </span>
      );
    }
    function AskToBadge({ v }) {
      const a = ASK_TO.find(x => x.v === v);
      if (!a || v === "any") return null;
      return <span className="inline-flex items-center gap-0.5 text-[11px] font-bold text-sub border border-line px-2 py-[1px] rounded-full"><Icon n={a.icon} size={13} />{a.label}聞きたい</span>;
    }

    // ボトムシート（外側タップ／つまみを下に引くと閉じる）
    function Sheet({ onClose, z = 50, children }) {
      useScrollLock();
      const [dy, setDy] = useState(0);
      const [dragging, setDragging] = useState(false);
      const drag = useRef({ y: null, t: 0, v: 0, last: 0 });
      const onDown = (e) => { drag.current = { y: e.clientY, t: Date.now(), v: 0, last: e.clientY }; setDragging(true); try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {} };
      const onMove = (e) => {
        if (drag.current.y == null) return;
        const now = Date.now(); const dt = Math.max(1, now - drag.current.t);
        drag.current.v = (e.clientY - drag.current.last) / dt; drag.current.last = e.clientY; drag.current.t = now;
        setDy(Math.max(0, e.clientY - drag.current.y));
      };
      const onUp = () => {
        if (drag.current.y == null) return;
        const fast = drag.current.v > 0.6; drag.current.y = null; setDragging(false);
        if (dy > 110 || (fast && dy > 30)) onClose(); else setDy(0);
      };
      return (
        <div className="fixed inset-0 flex items-end justify-center animate-fade-in" style={{ zIndex: z, background: `rgb(10 20 18 / ${Math.max(0.12, 0.5 - dy / 700)})`, touchAction: "none" }} onClick={onClose}>
          <div className="bg-surface text-ink w-full max-w-md rounded-t-[2rem] max-h-[92vh] flex flex-col overflow-hidden animate-slide-up shadow-lift"
            style={{ transform: dy ? `translateY(${dy}px)` : undefined, transition: dragging ? "none" : "transform .25s cubic-bezier(.22,1,.36,1)", touchAction: "auto" }}
            onClick={(e) => e.stopPropagation()}>
            <div className="pt-3 pb-2 flex justify-center cursor-grab touch-none select-none" onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp} role="presentation">
              <div className="w-10 h-1.5 bg-line rounded-full"></div>
            </div>
            {children}
          </div>
        </div>
      );
    }
    function SheetHeader({ title, icon, onClose, onBack, right }) {
      return (
        <div className="px-5 py-2 flex justify-between items-center gap-2">
          <div className="flex items-center gap-1 min-w-0">
            {onBack && <button onClick={onBack} aria-label="戻る" className="w-9 h-9 -ml-2 rounded-full flex items-center justify-center text-ink press"><Icon n="arrow_back_ios_new" size={20} /></button>}
            <h3 className="font-head font-black text-[17px] flex items-center gap-2 min-w-0">
              {icon && <Icon n={icon} fill className="text-brand-deep" />}
              <span className="truncate">{title}</span>
            </h3>
          </div>
          <div className="flex items-center gap-1 flex-shrink-0">
            {right}
            {onClose && <button onClick={onClose} aria-label="閉じる" className="w-9 h-9 rounded-full bg-sunk text-sub flex items-center justify-center press"><Icon n="close" size={20} /></button>}
          </div>
        </div>
      );
    }
    function Dialog({ onClose, children, z = 60 }) {
      useScrollLock();
      return (
        <div className="fixed inset-0 flex items-center justify-center p-4 animate-fade-in" style={{ zIndex: z, background: "rgb(10 20 18 / .55)" }} onClick={onClose}>
          <div className="bg-surface text-ink w-full max-w-sm rounded-[2rem] shadow-lift max-h-[88vh] overflow-y-auto animate-slide-up" onClick={(e) => e.stopPropagation()}>{children}</div>
        </div>
      );
    }
    function Segmented({ value, onChange, options }) {
      return (
        <div className="bg-sunk rounded-2xl p-1 flex gap-1" role="tablist">
          {options.map(o => (
            <button key={o.value} role="tab" aria-selected={value === o.value} onClick={() => onChange(o.value)}
              className={cx("flex-1 py-2 rounded-xl text-[13px] font-bold flex items-center justify-center gap-1.5 press min-w-0", value === o.value ? "bg-surface text-ink shadow-soft font-black" : "text-sub")}>
              {o.icon && <Icon n={o.icon} fill={value === o.value} size={18} />}
              <span className="truncate">{o.label}</span>
            </button>
          ))}
        </div>
      );
    }
    function Toggle({ on, onChange, label }) {
      return (
        <button role="switch" aria-checked={on} aria-label={label} onClick={() => onChange(!on)}
          className={cx("w-12 h-7 rounded-full p-0.5 flex-shrink-0 transition-colors", on ? "bg-brand" : "bg-line")}>
          <span className={cx("block w-6 h-6 rounded-full bg-white shadow-soft transition-transform", on && "translate-x-5")}></span>
        </button>
      );
    }
    function SectionHead({ title, sub, action, onAction, icon }) {
      return (
        <div className="flex items-end justify-between px-1 gap-2">
          <div className="min-w-0">
            <h2 className="font-head font-black text-[17px] flex items-center gap-1.5">{icon && <Icon n={icon} fill size={20} className="text-brand-deep" />}{title}</h2>
            {sub && <p className="text-[12px] text-sub leading-snug">{sub}</p>}
          </div>
          {action && <button onClick={onAction} className="text-[12px] font-bold text-brand-deep press flex-shrink-0 flex items-center">{action}<Icon n="chevron_right" size={16} /></button>}
        </div>
      );
    }
    function ScrollRow({ className, children }) {
      const ref = useRef(null);
      const [more, setMore] = useState(false);
      const check = () => { const el = ref.current; if (el) setMore(el.scrollWidth - el.clientWidth - el.scrollLeft > 6); };
      useEffect(() => { check(); const t = setTimeout(check, 300); return () => clearTimeout(t); });
      return <div ref={ref} onScroll={check} className={cx(className, more && "fade-r")}>{children}</div>;
    }
    function EmptyState({ icon, text, action, onAction }) {
      return (
        <div className="text-center py-10 space-y-3">
          <Icon n={icon || "search_off"} size={36} className="text-mute" />
          <p className="text-[13px] text-mute">{text}</p>
          {action && <button onClick={onAction} className={cx(BTN_SOFT, "px-5")}>{action}</button>}
        </div>
      );
    }

    // ============================================================
    // 🃏 質問のカード
    // ============================================================
    // 横スクロール用（回答を待っている質問・仲間募集）
    function QuestionCard({ post, onOpen, wide, unread }) {
      const mine = post.author.mine;
      const recruit = post.category === "仲間募集";
      const answerers = post.comments.slice(0, 3);
      return (
        <button onClick={onOpen} className={cx(wide ? "w-full" : "w-[252px] flex-shrink-0", "text-left bg-surface rounded-3xl border shadow-soft p-4 flex flex-col gap-2.5 press relative", mine ? "border-brand ring-2 ring-brand/20" : "border-line/70")}>
          <span className="flex items-center gap-1.5 text-[11px] text-mute">
            {mine ? <MineBadge /> : <><Icon n={catMeta(post.category).icon} fill size={14} className="text-brand-deep" />{catMeta(post.category).short}・{displayName(post.author)}</>}
            {unread && <span className="ml-auto bg-brand text-on-brand text-[11px] font-black px-2 py-0.5 rounded-full flex items-center gap-0.5"><Icon n="notifications_active" fill size={12} />新着</span>}
          </span>
          {post.joiners.length > 0 && (
            <span className="self-start inline-flex items-center gap-0.5 bg-brand-tint text-brand-deep text-[11px] font-black px-2 py-0.5 rounded-full"><Icon n="group" size={13} />同じ疑問 {post.joiners.length}人</span>
          )}
          <span className="flex gap-2">
            <span className="font-head font-black text-[22px] leading-none text-brand">{recruit ? <Icon n="diversity_3" fill size={22} /> : "Q."}</span>
            <span className="font-head font-bold text-[15px] leading-snug line-clamp-3">{plainTitle(post.title)}</span>
          </span>
          <span className="mt-auto flex items-center justify-between gap-2 pt-1">
            {answerers.length > 0 ? (
              <span className="flex items-center gap-1.5 min-w-0">
                <span className="flex -space-x-2">{answerers.map(c => <span key={c.id} className="ring-2 ring-surface rounded-full"><Avatar user={c.user} size={22} /></span>)}</span>
                <span className="text-[11px] text-sub truncate">{post.comments.length}人が{recruit ? "参加希望" : "回答"}</span>
              </span>
            ) : <span className="text-[11px] text-sub">{agoLabel(post.at)}</span>}
            {mine
              ? <span className="flex-shrink-0 border border-brand text-brand-deep text-[12px] font-black px-3 py-1.5 rounded-full">確認する</span>
              : <span className="flex-shrink-0 bg-brand text-on-brand text-[12px] font-black px-3 py-1.5 rounded-full">{recruit ? "参加したい" : "答える"}</span>}
          </span>
        </button>
      );
    }

    // 縦の一覧用
    function QuestionRow({ post, onOpen, onWatch, tokens, unread }) {
      const mine = post.author.mine;
      const recruit = post.category === "仲間募集";
      const solved = post.bestAnswerId || post.closed;
      const n = post.comments.length;
      return (
        <article onClick={onOpen} className={cx("bg-surface rounded-3xl p-4 shadow-soft border cursor-pointer press animate-fade-up space-y-2", unread ? "border-brand/60 ring-2 ring-brand/15" : mine ? "border-brand/50" : "border-line/70")}>
          <div className="flex items-center gap-1.5 flex-wrap">
            <CategoryChip cat={post.category} />
            {mine ? <MineBadge /> : <span className="text-[12px] text-mute">{displayName(post.author)}</span>}
            <span className="text-[12px] text-mute">・{agoLabel(post.at)}</span>
            {unread && <span className="ml-auto bg-brand text-on-brand text-[11px] font-black px-2 py-0.5 rounded-full">新着</span>}
          </div>
          <h3 className="font-head font-bold text-[15.5px] leading-snug flex gap-1.5">
            <span className="text-brand font-black">{recruit ? "募" : "Q."}</span>
            <span className="min-w-0 break-words"><Highlight text={plainTitle(post.title)} tokens={tokens} /></span>
          </h3>
          {tokens && tokens.length > 0 && <p className="text-[12.5px] text-sub line-clamp-1"><Highlight text={post.content} tokens={tokens} /></p>}
          <div className="flex items-center justify-between gap-2 pt-0.5">
            <div className="flex items-center gap-2.5 text-[12px] text-mute flex-wrap">
              {solved ? <SolvedBadge recruit={recruit} /> : (
                <span className={cx("inline-flex items-center gap-1 font-bold", n ? "text-sub" : "text-brand-deep")}>
                  <Icon n="forum" size={15} />{n ? `${recruit ? "参加希望" : "回答"} ${n}` : (recruit ? "参加者募集中" : "回答募集中")}
                </span>
              )}
              {n >= SUMMARY_MIN_ANSWERS && !recruit && <span className="bg-brand-tint text-brand-deep text-[11px] font-black px-2 py-0.5 rounded-full inline-flex items-center gap-0.5"><Icon n="auto_awesome" fill size={12} />AI要約</span>}
              {post.joiners.length > 0 && <span className="inline-flex items-center gap-0.5 font-bold text-brand-deep"><Icon n="group" size={14} />同じ疑問 {post.joiners.length}</span>}
            </div>
            {!mine && (
              <button onClick={(e) => { e.stopPropagation(); onWatch(post.id); }} aria-pressed={post.watched} aria-label="気になる"
                className={cx("flex items-center gap-1 px-2.5 py-1 rounded-full text-[12px] font-bold press flex-shrink-0", post.watched ? "bg-love-tint text-love-ink" : "text-mute")}>
                <Icon n="bookmark" fill={post.watched} size={16} className={post.watched ? "text-love" : ""} />気になる {post.watchers}
              </button>
            )}
          </div>
        </article>
      );
    }

    // ============================================================
    // ✨ AI要約（回答が多い質問）
    // ============================================================
    function AnswerSummary({ post, onJump, onReportSummary }) {
      const s = useMemo(() => summarizeAnswers(post.comments), [post.comments]);
      return (
        <div className="bg-sunk rounded-3xl p-4 space-y-3">
          <div className="flex justify-between items-center gap-2">
            <span className="font-head font-black text-[15px] text-brand-deep flex items-center gap-1.5"><Icon n="auto_awesome" fill size={20} />AIの回答まとめ</span>
            <span className="text-[11px] text-mute">回答{s.n}件から</span>
          </div>
          <p className="text-[14px] font-bold leading-relaxed bg-surface rounded-2xl p-3.5">{s.headline}</p>
          {s.keywords.length > 0 && (
            <div className="space-y-2">
              <span className="text-[12px] font-bold text-sub block">よく出た意見</span>
              {s.keywords.map(k => (
                <div key={k.label} className="space-y-1">
                  <div className="flex justify-between text-[12px] font-bold"><span>{k.label}</span><span className="text-sub">{k.count}件</span></div>
                  <div className="h-2 rounded-full bg-surface overflow-hidden"><div className="h-full rounded-full bg-brand animate-grow" style={{ width: `${Math.max(k.pct, 6)}%` }}></div></div>
                </div>
              ))}
            </div>
          )}
          {s.best && (
            <div className="bg-surface rounded-2xl p-3 space-y-1">
              <span className="text-[12px] font-black text-love-ink flex items-center gap-1"><Icon n="favorite" fill size={14} />いちばん「助かった！」が多い回答</span>
              <p className="text-[13px] leading-relaxed">{s.best.text}</p>
            </div>
          )}
          <div className="flex items-center justify-between gap-2 pt-0.5">
            <button onClick={onJump} className="text-[12px] font-bold text-brand-deep flex items-center gap-0.5 press"><Icon n="arrow_downward" size={15} />元の回答を見る</button>
            <button onClick={onReportSummary} className="text-[12px] font-bold text-mute flex items-center gap-0.5 press"><Icon n="flag" size={14} />要約の誤りを報告</button>
          </div>
          <p className="text-[11px] text-mute">※ AIによる要約です。正確な内容は元の回答を確認してください（デモ：キーワード集計）</p>
        </div>
      );
    }

    // ============================================================
    // 🔐 入口（大学メール認証）→ 学部・学年の登録
    //   ※ デモのため実際のメール認証は行いません
    // ============================================================
    function GateScreen({ onEnter }) {
      const [email, setEmail] = useState("");
      const [error, setError] = useState("");
      const submit = () => {
        if (!email.includes("@") || email.trim().length < 5) { setError("大学のメールアドレスを入力してください（デモのため、形式だけ確認します）"); return; }
        onEnter();
      };
      const points = [
        { icon: "verified_user", title: `${U.short}生だけ` },
        { icon: "visibility_off", title: "名前は出ない" },
        { icon: "volunteer_activism", title: "ずっと無料" }
      ];
      return (
        <div className="w-full max-w-md mx-auto min-h-screen bg-bg text-ink flex flex-col px-6 pt-14 pb-10 overflow-x-hidden">
          <div className="flex-1 flex flex-col justify-center space-y-7">
            <div className="space-y-4 animate-fade-up">
              <img src={LOGO_MARK} alt="" className="w-14 h-14" />
              <h1 className="font-head font-black text-[28px] leading-tight">
                {U.short}のことは、<br /><span className="text-brand-deep">{U.short}生の先輩に聞こう。</span>
              </h1>
              <p className="text-[13.5px] text-sub leading-relaxed">過去問・授業のリアル・ゼミのこと。<br />公式には載っていない「先輩の知恵」が集まるQ&Aです。</p>
            </div>
            <div className="grid grid-cols-3 gap-2">
              {points.map((p, i) => (
                <div key={p.icon} className="flex flex-col items-center gap-1.5 bg-surface rounded-3xl py-4 px-1 border border-line/70 animate-fade-up" style={{ animationDelay: `${120 + i * 70}ms` }}>
                  <Icon n={p.icon} fill size={26} className="text-brand" />
                  <p className="font-bold text-[12px] whitespace-nowrap">{p.title}</p>
                </div>
              ))}
            </div>
            <div className="space-y-3 animate-fade-up" style={{ animationDelay: "360ms" }}>
              <div>
                <label className={LABEL} htmlFor="gate-email">大学のメールアドレス</label>
                <input id="gate-email" type="email" inputMode="email" placeholder="例：xxxx@○○.ac.jp" value={email}
                  onChange={(e) => { setEmail(e.target.value); setError(""); }}
                  onKeyDown={(e) => { if (e.key === "Enter" && !e.nativeEvent.isComposing) submit(); }} className={INPUT} />
                {error && <p className="text-[12px] text-danger-ink font-bold mt-1.5">{error}</p>}
              </div>
              <button onClick={submit} className={cx(BTN_PRIMARY, "w-full py-4")}>{U.short}生として入る</button>
              <p className="text-[12px] text-mute text-center">デモ版（実際の認証は行いません）</p>
            </div>
          </div>
        </div>
      );
    }

    function ProfileForm({ initial, onSave, saveLabel }) {
      const [faculty, setFaculty] = useState(initial.faculty);
      const [grade, setGrade] = useState(initial.grade);
      const [anonDefault, setAnonDefault] = useState(initial.anonDefault);
      return (
        <div className="space-y-5">
          <div>
            <label className={LABEL} htmlFor="pf-fac">学部</label>
            <select id="pf-fac" value={faculty} onChange={(e) => setFaculty(e.target.value)} className={cx(INPUT, "font-bold")}>
              {U.faculties.map(f => <option key={f}>{f}</option>)}
            </select>
          </div>
          <div>
            <span className={LABEL}>学年</span>
            <div className="grid grid-cols-5 gap-1.5">
              {GRADES.map(g => (
                <button key={g} onClick={() => setGrade(g)} aria-pressed={grade === g}
                  className={cx("py-3 rounded-2xl text-[14px] font-black border-[1.5px] press", grade === g ? "bg-brand text-on-brand border-brand" : "bg-surface text-sub border-line")}>{gradeLabel(g)}</button>
              ))}
            </div>
            <p className="text-[11.5px] text-mute mt-1.5">学年に合った質問が「あなた向け」に届きます</p>
          </div>
          <label className="flex items-start gap-3 bg-sunk rounded-3xl p-3.5 cursor-pointer select-none">
            <input type="checkbox" checked={anonDefault} onChange={(e) => setAnonDefault(e.target.checked)} className="mt-1 w-4 h-4 accent-[rgb(var(--brand))]" />
            <span className="leading-relaxed">
              <span className="font-bold text-[14px] block">質問・回答はふだん匿名にする</span>
              <span className="text-[12px] text-sub block">匿名でも「{U.short}生・学年」だけは表示されます</span>
            </span>
          </label>
          <button onClick={() => onSave({ faculty, grade, anonDefault })} className={cx(BTN_PRIMARY, "w-full py-4")}>{saveLabel}</button>
        </div>
      );
    }

    function OnboardingScreen({ onDone }) {
      return (
        <div className="w-full max-w-md mx-auto min-h-screen bg-bg text-ink px-6 pt-12 pb-10 space-y-6">
          <div className="space-y-2 animate-fade-up">
            <p className="text-[12px] font-bold text-brand-deep flex items-center gap-1"><Icon n="verified" fill size={16} />{U.name}のメールを確認しました（デモ）</p>
            <h1 className="font-head font-black text-[24px] leading-tight">あなたの学部と学年を<br />教えてください</h1>
            <p className="text-[13px] text-sub">名前は登録しません。あとからマイページで変えられます。</p>
          </div>
          <div className="animate-fade-up" style={{ animationDelay: "120ms" }}>
            <ProfileForm initial={{ faculty: U.defaultFaculty, grade: 1, anonDefault: true }} onSave={onDone} saveLabel="はじめる" />
          </div>
        </div>
      );
    }

    // ============================================================
    // ✍️ 質問する（テンプレート → 穴うめ → 似た質問チェック → 投稿）
    // ============================================================
    function AskSheet({ me, posts, preset, onClose, onSubmit, onJoin, onOpenPost }) {
      const [tpl, setTpl] = useState(preset && preset.tpl ? TEMPLATES.find(t => t.id === preset.tpl) : null);
      const [vals, setVals] = useState({});
      const [category, setCategory] = useState((preset && preset.cat) || "授業・過去問");
      const [askTo, setAskTo] = useState("senpai");
      const [detail, setDetail] = useState("");
      const [anon, setAnon] = useState(me.anonDefault);
      const [joinTarget, setJoinTarget] = useState(null);
      const [joinNote, setJoinNote] = useState("");

      const pick = (t) => {
        setTpl(t); setVals({});
        if (t.cat) setCategory(t.cat);
        setAskTo(t.id === "buddy" ? "any" : "senpai");
      };
      const ready = tpl && tpl.fields.every(f => f.optional || String(vals[f.k] || "").trim());
      const title = tpl && ready ? tpl.make(Object.fromEntries(Object.entries(vals).map(([k, v]) => [k, String(v).trim()]))) : "";
      const similar = useMemo(() => (title ? findSimilarQuestions(posts, title, category) : []), [title, category, posts]);
      const recruit = category === "仲間募集";

      if (!tpl) {
        return (
          <Sheet onClose={onClose}>
            <SheetHeader title="質問する" icon="help" onClose={onClose} />
            <div className="px-5 pb-6 pt-1 overflow-y-auto space-y-3">
              <p className="text-[13px] text-sub">何について聞きたい？ 選ぶと、あとは空欄をうめるだけです。</p>
              <div className="grid grid-cols-2 gap-2">
                {TEMPLATES.map(t => (
                  <button key={t.id} onClick={() => pick(t)} className={cx("text-left rounded-3xl p-3.5 flex flex-col gap-2 press border", t.id === "free" ? "bg-surface border-line" : "bg-sunk border-transparent")}>
                    <span className="w-10 h-10 rounded-2xl bg-surface text-brand-deep flex items-center justify-center"><Icon n={t.icon} fill size={24} /></span>
                    <span>
                      <span className="block font-head font-black text-[14.5px] leading-tight">{t.label}</span>
                      <span className="block text-[11.5px] text-sub mt-0.5">{t.sub}</span>
                    </span>
                  </button>
                ))}
              </div>
            </div>
          </Sheet>
        );
      }

      return (
        <Sheet onClose={onClose}>
          <SheetHeader title={tpl.label} icon={tpl.icon} onBack={() => setTpl(null)} onClose={onClose} />
          <div className="px-5 pb-4 pt-1 overflow-y-auto space-y-4 flex-1">
            {tpl.fields.map(f => (
              <div key={f.k}>
                <label className={LABEL} htmlFor={`f-${f.k}`}>{f.label}</label>
                <input id={`f-${f.k}`} type="text" value={vals[f.k] || ""} placeholder={f.ph}
                  onChange={(e) => setVals({ ...vals, [f.k]: e.target.value })} className={INPUT} />
                {f.chips && (
                  <div className="flex flex-wrap gap-1.5 mt-2">
                    {f.chips.map(c => (
                      <button key={c} type="button" onClick={() => setVals({ ...vals, [f.k]: c })} aria-pressed={vals[f.k] === c}
                        className={cx("text-[12px] font-bold px-2.5 py-1 rounded-full press border", vals[f.k] === c ? "bg-brand-tint text-brand-deep border-brand/50" : "border-line text-sub")}>{c}</button>
                    ))}
                  </div>
                )}
              </div>
            ))}

            {/* できあがる質問のプレビュー */}
            <div className={cx("rounded-3xl p-4 border-2 border-dashed", ready ? "border-brand/50 bg-brand-tint/50" : "border-line bg-sunk/60")}>
              <p className="text-[11.5px] font-bold text-sub mb-1">こんな質問になります</p>
              <p className="font-head font-bold text-[15.5px] leading-snug flex gap-1.5">
                <span className="text-brand font-black">{recruit ? "募" : "Q."}</span>
                <span className={ready ? "text-ink" : "text-mute"}>{ready ? title : "空欄をうめるとここに表示されます"}</span>
              </p>
            </div>

            {/* 🔗 似ている質問（合流するかは自分で決める） */}
            {similar.length > 0 && (
              <div className="bg-brand-tint/60 rounded-3xl p-3.5 space-y-2.5 animate-fade-up">
                <div>
                  <p className="text-[13.5px] font-black text-brand-deep flex items-center gap-1"><Icon n="group_add" size={18} />似ている質問があります</p>
                  <p className="text-[12px] text-sub leading-relaxed mt-0.5">同じ内容なら、一緒に回答を待てます。回答が届くとあなたにもお知らせします。</p>
                </div>
                {similar.map(p => {
                  const joined = p.joiners.some(j => j.mine);
                  const solved = p.bestAnswerId || p.closed;
                  return (
                    <div key={p.id} className="bg-surface rounded-2xl border border-line/70 p-3 space-y-2.5">
                      <button type="button" onClick={() => onOpenPost(p.id)} className="text-left w-full press">
                        <span className="flex gap-1.5"><span className="font-head font-black text-[15px] text-brand">Q.</span><span className="font-bold text-[14px] leading-snug line-clamp-2">{plainTitle(p.title)}</span></span>
                        <span className="flex flex-wrap items-center gap-x-2.5 gap-y-1 mt-1.5 text-[11.5px] text-mute">
                          {solved ? <SolvedBadge recruit={p.category === "仲間募集"} /> : <span className={p.comments.length ? "" : "font-bold text-brand-deep"}>{p.comments.length ? `回答 ${p.comments.length}件` : "回答募集中"}</span>}
                          {p.joiners.length > 0 && <span className="font-bold text-brand-deep flex items-center gap-0.5"><Icon n="group" size={14} />同じ疑問 {p.joiners.length}人</span>}
                        </span>
                      </button>
                      {solved ? (
                        <button type="button" onClick={() => onOpenPost(p.id)} className={cx(BTN_SOFT, "w-full text-[13px] py-2.5")}>答えを見る</button>
                      ) : joined ? (
                        <p className="text-[12.5px] font-bold text-brand-deep flex items-center gap-1"><Icon n="check_circle" fill size={16} />一緒に回答を待っています</p>
                      ) : joinTarget === p.id ? (
                        <div className="space-y-2">
                          <label className={LABEL}>あなたの条件をひとこと（任意）</label>
                          <textarea rows={2} value={joinNote} onChange={(e) => setJoinNote(e.target.value)} placeholder="例：2限も空いています" className={cx(INPUT, "text-[13.5px] py-2.5")} />
                          <div className="flex gap-2">
                            <button type="button" onClick={() => setJoinTarget(null)} className={cx(BTN_SOFT, "flex-1 text-[13px] py-2.5")}>やめる</button>
                            <button type="button" onClick={() => onJoin(p.id, joinNote.trim(), anon)} className={cx(BTN_PRIMARY, "flex-[2] text-[13.5px] py-2.5")}>一緒に待つ</button>
                          </div>
                        </div>
                      ) : (
                        <button type="button" onClick={() => { setJoinTarget(p.id); setJoinNote(detail.trim()); }} className="w-full bg-brand text-on-brand font-black rounded-2xl py-2.5 text-[13.5px] press flex items-center justify-center gap-1">
                          <Icon n="group_add" size={18} />この質問と一緒に回答を待つ
                        </button>
                      )}
                    </div>
                  );
                })}
                <p className="text-[11.5px] text-sub">状況がちがうときは、このまま新しく質問できます。</p>
              </div>
            )}

            <div>
              <label className={LABEL} htmlFor="ask-cat">カテゴリー</label>
              <select id="ask-cat" value={category} onChange={(e) => setCategory(e.target.value)} className={cx(INPUT, "font-bold")}>
                {CATEGORIES.map(c => <option key={c.key} value={c.key}>{c.key}</option>)}
              </select>
            </div>

            <div>
              <span className={LABEL}>だれに聞きたい？</span>
              <div className="grid grid-cols-3 gap-1.5">
                {ASK_TO.map(a => (
                  <button key={a.v} onClick={() => setAskTo(a.v)} aria-pressed={askTo === a.v}
                    className={cx("py-2.5 rounded-2xl text-[13px] font-bold border-[1.5px] flex items-center justify-center gap-1 press", askTo === a.v ? "bg-brand-tint text-brand-deep border-brand" : "bg-surface text-sub border-line")}>
                    <Icon n={a.icon} fill={askTo === a.v} size={17} />{a.label}
                  </button>
                ))}
              </div>
            </div>

            <div>
              <div className="flex items-baseline justify-between">
                <label className={LABEL} htmlFor="ask-detail">くわしい状況（任意）</label>
                {!detail && <button type="button" onClick={() => setDetail("・今の状況：\n・知りたいこと：")} className="text-[12px] font-bold text-brand-deep press">型を入れる</button>}
              </div>
              <textarea id="ask-detail" rows={3} value={detail} onChange={(e) => setDetail(e.target.value)}
                placeholder={recruit ? "例：週2くらい・学年や学部は問いません" : "状況を少し書くと、答えてもらいやすくなります"} className={cx(INPUT, "leading-relaxed")} />
            </div>

            <label className="flex items-start gap-3 bg-sunk rounded-3xl p-3.5 cursor-pointer select-none">
              <input type="checkbox" checked={anon} onChange={(e) => setAnon(e.target.checked)} className="mt-1 w-4 h-4 accent-[rgb(var(--brand))]" />
              <span className="leading-relaxed">
                <span className="font-bold text-[14px] block">匿名で質問する</span>
                <span className="text-[12px] text-sub block">表示：{displayName({ fac: facShort(me.faculty), grade: me.grade, anon })}</span>
              </span>
            </label>
            <p className="text-[12px] text-mute">※ 個人の特定・悪口はNG。<span className="font-bold">質問はずっと無料</span>です。</p>
          </div>
          <div className="px-4 pt-3 pb-4 border-t border-line">
            <button disabled={!ready} onClick={() => onSubmit({ title, category, askTo, content: detail.trim(), anon })} className={cx(BTN_PRIMARY, "w-full")}>
              {recruit ? "募集する" : "質問する"}
            </button>
          </div>
        </Sheet>
      );
    }

    // ============================================================
    // 💬 質問の詳細（回答・助かった！・いちばん助かった・AI要約・通報）
    // ============================================================
    function PostDetailSheet({ post, me, reported, kakomonCount, onClose, onWatch, onAnswer, onThanks, onPickBest, onCloseRecruit, onReport, onDemoAnswer, onOpenKakomon }) {
      const [input, setInput] = useState("");
      const [anon, setAnon] = useState(me.anonDefault);
      const [showAll, setShowAll] = useState(false);
      const [baTarget, setBaTarget] = useState(null);
      const [baMsg, setBaMsg] = useState("");
      const answersRef = useRef(null);
      const mine = post.author.mine;
      const recruit = post.category === "仲間募集";
      const solved = !!post.bestAnswerId || post.closed;
      const answeredByMe = post.comments.some(c => c.user.mine);
      const sorted = [...post.comments].sort((a, b) => ((b.id === post.bestAnswerId) - (a.id === post.bestAnswerId)) || ((b.thanks || 0) - (a.thanks || 0)));
      const visible = showAll ? sorted : sorted.slice(0, 5);
      const send = () => { const t = input.trim(); if (!t) return; onAnswer(post.id, t, anon); setInput(""); };
      const kCount = post.course ? kakomonCount(post.course) : 0;

      return (
        <Sheet onClose={onClose}>
          <div className="px-5 py-2 flex justify-between items-center gap-2">
            <div className="flex items-center gap-2.5 min-w-0">
              <Avatar user={post.author} size={36} />
              <div className="min-w-0">
                <div className="text-[13px] font-bold truncate">{mine ? "あなた" : displayName(post.author)}<span className="text-mute font-normal">・{agoLabel(post.at)}</span></div>
                <div className="flex items-center gap-1.5 mt-0.5 flex-wrap">
                  {mine && <MineBadge />}
                  {solved && <SolvedBadge recruit={recruit} />}
                  <CategoryChip cat={post.category} />
                  <AskToBadge v={post.askTo} />
                </div>
              </div>
            </div>
            <div className="flex items-center gap-1 flex-shrink-0">
              {!mine && <button onClick={() => onReport({ postId: post.id })} className="text-mute px-2 h-9 rounded-full flex items-center gap-0.5 text-[12px] font-bold press"><Icon n="flag" size={18} />通報</button>}
              <button onClick={onClose} aria-label="閉じる" className="w-9 h-9 rounded-full bg-sunk text-sub flex items-center justify-center press"><Icon n="close" size={20} /></button>
            </div>
          </div>

          <div className="px-5 pb-4 pt-2 overflow-y-auto space-y-4 flex-1">
            <h2 className="font-head font-black text-[20px] leading-snug">{plainTitle(post.title)}</h2>
            {post.content && <p className="text-[14px] text-sub leading-relaxed break-words whitespace-pre-wrap">{post.content}</p>}

            {post.joiners.length > 0 && (
              <div className="bg-sunk rounded-3xl p-3.5 space-y-2">
                <p className="text-[13px] font-black flex items-center gap-1"><Icon n="group" size={18} className="text-brand-deep" />同じ疑問の人 {post.joiners.length}人</p>
                <p className="text-[12px] text-sub leading-relaxed">{solved ? "ほかの人も一緒に回答を待っていました。" : `回答すると、質問した人とこの${post.joiners.length}人全員に届きます。`}</p>
                {post.joiners.filter(j => j.note).map(j => (
                  <div key={j.id} className="bg-surface rounded-2xl px-3 py-2">
                    <span className="text-[11.5px] font-bold text-mute">{j.mine ? "あなた" : displayName(j.who)}の条件</span>
                    <p className="text-[13px] leading-relaxed break-words">{j.note}</p>
                  </div>
                ))}
              </div>
            )}

            {kCount > 0 && (
              <button onClick={() => onOpenKakomon(post.course)} className="w-full text-left bg-brand-tint rounded-3xl p-3.5 flex items-center gap-3 press">
                <span className="w-10 h-10 rounded-2xl bg-surface text-brand-deep flex items-center justify-center flex-shrink-0"><Icon n="description" fill size={22} /></span>
                <span className="flex-1 min-w-0">
                  <span className="block font-black text-[14px] text-brand-deep">【{post.course}】の過去問 {kCount}件</span>
                  <span className="block text-[12px] text-sub">閲覧チケットで見られます</span>
                </span>
                <Icon n="chevron_right" className="text-brand-deep" />
              </button>
            )}

            <div className="flex justify-between items-center pt-3 border-t border-line">
              <span className="text-mute text-[12px] flex items-center gap-1"><Icon n="visibility" size={15} />{post.views}</span>
              {!mine && (
                <button onClick={() => onWatch(post.id)} aria-pressed={post.watched}
                  className={cx("flex items-center gap-1.5 px-4 py-2 rounded-full font-black text-[14px] press", post.watched ? "bg-love text-white shadow-soft" : "bg-surface border border-line text-ink")}>
                  <Icon n="bookmark" fill={post.watched} size={18} /><span>気になる {post.watchers}</span>
                </button>
              )}
            </div>
            {!mine && !post.watched && !solved && <p className="text-[11.5px] text-mute -mt-2 text-right">「気になる」で、回答が届いたらお知らせします</p>}

            <div className="pt-3 border-t border-line space-y-3" ref={answersRef}>
              {!recruit && post.comments.length >= SUMMARY_MIN_ANSWERS && (
                <AnswerSummary post={post}
                  onJump={() => { const el = document.getElementById("answer-list"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }}
                  onReportSummary={() => onReport({ postId: post.id, summary: true })} />
              )}
              <h3 id="answer-list" className="font-head font-black text-[16px] scroll-mt-4">
                {recruit ? `参加希望・返信 (${post.comments.length}件)` : `回答 (${post.comments.length}件)`}
                {sorted.length > 1 && !recruit && <span className="ml-2 text-[12px] font-medium text-mute">助かった！順</span>}
              </h3>
              {mine && !solved && !recruit && post.comments.some(c => !c.user.mine) && (
                <div className="bg-brand-tint rounded-2xl px-3.5 py-3 text-[12.5px] text-brand-deep font-bold flex items-start gap-2">
                  <Icon n="workspace_premium" fill size={18} className="flex-shrink-0" />
                  <span>いちばん助かった回答を1つ選ぶと解決済みになり、回答した人に閲覧チケット+{TICKET_RULES.best}枚が届きます</span>
                </div>
              )}
              {mine && recruit && !post.closed && post.comments.length > 0 && (
                <button onClick={() => onCloseRecruit(post.id)} className={cx(BTN_SOFT, "w-full text-[13px]")}>メンバーが集まったので募集を締め切る</button>
              )}

              <div className="space-y-2.5">
                {sorted.length === 0 ? (
                  <div className="text-center py-3 space-y-2.5">
                    <p className="text-mute text-[13px]">{recruit ? "まだ返信はありません" : "まだ回答がありません"}</p>
                    {mine && <button onClick={() => onDemoAnswer(post.id)} className="bg-sunk text-ink font-bold text-[13px] px-4 py-2 rounded-xl press">サンプル回答を追加（デモ）</button>}
                  </div>
                ) : (
                  <>
                    {visible.map((c, idx) => {
                      if (reported.includes(`c:${post.id}:${c.id}`)) return <div key={c.id} className="bg-sunk p-3 rounded-2xl text-[12px] text-mute">通報済みのため、この回答は非表示にしています。</div>;
                      const isBA = post.bestAnswerId === c.id;
                      const cMine = c.user.mine;
                      const topThanks = !recruit && !post.bestAnswerId && idx === 0 && (c.thanks || 0) > 0 && sorted.length > 1;
                      const canPick = mine && !solved && !recruit && !cMine;
                      return (
                        <div key={c.id} className={cx("p-3.5 rounded-3xl space-y-2 animate-fade-up", isBA ? "bg-surface border-2 border-brand" : cMine ? "bg-brand-tint/60 border border-brand/40" : "bg-sunk")}>
                          {isBA && <span className="inline-flex items-center gap-1 bg-brand text-on-brand text-[12px] font-black px-2.5 py-0.5 rounded-full"><Icon n="workspace_premium" fill size={14} />いちばん助かった</span>}
                          {topThanks && <span className="inline-flex items-center gap-1 text-love-ink text-[12px] font-black"><Icon n="favorite" fill size={14} />いちばん助かった！が多い</span>}
                          <div className="flex items-center gap-2">
                            <Avatar user={c.user} size={28} />
                            <span className="text-[13px] font-bold flex-1 min-w-0 truncate">{cMine ? <MineBadge type="answer" /> : displayName(c.user)}</span>
                            <span className="text-mute text-[12px]">{agoLabel(c.at)}</span>
                          </div>
                          <p className="text-[14px] leading-relaxed break-words whitespace-pre-wrap">{c.text}</p>
                          {isBA && post.bestThanks && (
                            <div className="bg-brand-tint rounded-2xl px-3 py-2.5 text-[13px] leading-relaxed"><span className="block text-[11px] font-black text-brand-deep mb-0.5">質問した人からのお礼</span>{post.bestThanks}</div>
                          )}
                          {canPick && (
                            <button onClick={() => { setBaMsg(""); setBaTarget(c); }} className="w-full border-[1.5px] border-brand text-brand-deep font-black text-[13px] py-2 rounded-2xl flex items-center justify-center gap-1 press">
                              <Icon n="workspace_premium" size={17} />「いちばん助かった」に選ぶ
                            </button>
                          )}
                          <div className="flex justify-between items-center">
                            <button onClick={() => onThanks(post.id, c.id)} disabled={cMine}
                              className={cx("flex items-center gap-1 px-3 py-1 rounded-full font-black text-[12px] press", c.liked ? "bg-love text-white" : cMine ? "text-mute" : "bg-surface border border-line text-ink")}>
                              <Icon n="favorite" fill={c.liked} size={15} /><span>助かった！ {c.thanks || 0}</span>
                            </button>
                            {!cMine && <button onClick={() => onReport({ postId: post.id, commentId: c.id })} className="text-mute flex items-center gap-0.5 text-[12px] font-bold press"><Icon n="flag" size={15} />通報</button>}
                          </div>
                        </div>
                      );
                    })}
                    {!showAll && sorted.length > visible.length && (
                      <button onClick={() => setShowAll(true)} className={cx(BTN_SOFT, "w-full")}>すべての回答を見る（{sorted.length}件）</button>
                    )}
                  </>
                )}
              </div>
            </div>
          </div>

          {solved ? (
            <div className="px-4 pt-3 pb-4 border-t border-line bg-surface text-center text-[13px] text-sub font-bold flex items-center justify-center gap-1.5">
              <Icon n="check_circle" fill size={18} className="text-brand" />{recruit ? "募集は締め切られました" : "解決済みのため、回答の受付は終了しました"}
            </div>
          ) : mine ? null : (
            <div className="px-4 pt-2.5 pb-3.5 border-t border-line bg-surface space-y-1.5">
              <div className="flex items-center justify-between text-[12px]">
                <span className={cx("font-bold flex items-center gap-1", anon ? "text-brand-deep" : "text-sub")}><Icon n="visibility_off" fill={anon} size={14} />{anon ? "匿名" : "学部・学年"}で送信：{displayName({ fac: facShort(me.faculty), grade: me.grade, anon })}</span>
                {!answeredByMe && !recruit && <span className="font-black text-brand-deep flex items-center gap-0.5"><Icon n="confirmation_number" fill size={14} />回答で閲覧チケット+{TICKET_RULES.answer}</span>}
              </div>
              <div className="flex gap-2 items-center">
                <button onClick={() => setAnon(!anon)} aria-pressed={anon} aria-label="匿名で送る（学部は非表示）"
                  className={cx("w-11 h-11 rounded-full flex items-center justify-center flex-shrink-0 press", anon ? "bg-brand text-on-brand" : "bg-sunk text-sub")}>
                  <Icon n="visibility_off" fill={anon} size={22} />
                </button>
                <input type="text" value={input} onChange={(e) => setInput(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter" && !e.nativeEvent.isComposing) send(); }}
                  placeholder={recruit ? "参加したい！ひとこと…" : "あなたの経験を教えてください…"} className={cx(INPUT, "flex-1 min-w-0 rounded-full")} />
                <button onClick={send} disabled={!input.trim()} className="bg-brand text-on-brand font-black px-4 h-11 rounded-full text-[14px] shadow-soft press flex-shrink-0 disabled:opacity-50">{recruit ? "返信" : "回答"}</button>
              </div>
            </div>
          )}

          {baTarget && (
            <Dialog onClose={() => setBaTarget(null)}>
              <div className="p-5 space-y-4">
                <div className="text-center space-y-1">
                  <Icon n="workspace_premium" fill size={40} className="text-brand" />
                  <h3 className="font-head font-black text-[17px]">この回答を「いちばん助かった」に選びますか？</h3>
                  <p className="text-[12.5px] text-sub">質問は解決済みになり、回答の受付を終了します</p>
                </div>
                <p className="bg-sunk rounded-2xl p-3 text-[13px] leading-relaxed">{baTarget.text}</p>
                <div>
                  <label className={LABEL} htmlFor="ba-thanks">お礼のひとこと（任意）</label>
                  <input id="ba-thanks" type="text" value={baMsg} onChange={(e) => setBaMsg(e.target.value)} placeholder="例：とても参考になりました！" className={INPUT} />
                </div>
                <div className="flex gap-2">
                  <button onClick={() => setBaTarget(null)} className={cx(BTN_SOFT, "flex-1")}>やめる</button>
                  <button onClick={() => { onPickBest(post.id, baTarget.id, baMsg.trim()); setBaTarget(null); }} className={cx(BTN_PRIMARY, "flex-[2] text-[14px]")}>選ぶ</button>
                </div>
              </div>
            </Dialog>
          )}
        </Sheet>
      );
    }

    // 通報
    function ReportDialog({ target, onClose, onSubmit }) {
      const [reason, setReason] = useState("");
      return (
        <Dialog onClose={onClose} z={70}>
          <div className="p-5 space-y-4">
            <h3 className="font-head font-black text-[17px] flex items-center gap-1.5"><Icon n="flag" fill className="text-danger" />{target.summary ? "要約の誤りを報告" : "通報する"}</h3>
            {target.summary ? (
              <textarea rows={3} value={reason} onChange={(e) => setReason(e.target.value)} placeholder="どこが元の回答とちがっていましたか？" className={cx(INPUT, "leading-relaxed")} />
            ) : (
              <div className="space-y-1.5">
                {REPORT_REASONS.map(r => (
                  <button key={r} onClick={() => setReason(r)} aria-pressed={reason === r}
                    className={cx("w-full text-left rounded-2xl px-4 py-3 text-[13.5px] font-bold press flex items-center gap-2", reason === r ? "bg-danger-tint text-danger-ink" : "bg-sunk")}>
                    <Icon n={reason === r ? "radio_button_checked" : "radio_button_unchecked"} size={18} />{r}
                  </button>
                ))}
              </div>
            )}
            <p className="text-[11.5px] text-mute">運営が確認し、ガイドライン違反なら非表示にします。{target.summary ? "" : "あなたの画面からはすぐに非表示になります。"}</p>
            <div className="flex gap-2">
              <button onClick={onClose} className={cx(BTN_SOFT, "flex-1")}>やめる</button>
              <button disabled={!reason.trim()} onClick={() => onSubmit(reason)} className={cx("flex-[2] bg-danger text-white font-black rounded-2xl py-3 text-[14px] press disabled:opacity-50")}>送信する</button>
            </div>
          </div>
        </Dialog>
      );
    }

    // ============================================================
    // 📚 過去問ライブラリ（閲覧チケットで見る）
    // ============================================================
    function TicketCard({ tickets, onEarn }) {
      return (
        <div className="bg-brand text-on-brand rounded-3xl p-4 shadow-soft space-y-3 relative overflow-hidden"
          style={{ backgroundImage: "radial-gradient(rgb(255 255 255 / .12) 1px, transparent 1px)", backgroundSize: "14px 14px" }}>
          <div className="flex items-center justify-between gap-3">
            <div>
              <p className="text-[12px] font-bold opacity-90">あなたの閲覧チケット</p>
              <p className="font-head font-black text-[34px] leading-none mt-1 tabular-nums">{tickets}<span className="text-[15px] ml-1">枚</span></p>
            </div>
            <Icon n="confirmation_number" fill size={52} className="opacity-90" />
          </div>
          <div className="grid grid-cols-3 gap-1.5 text-center">
            {[["質問に回答", `+${TICKET_RULES.answer}`], ["いちばん助かった", `+${TICKET_RULES.best}`], ["過去問を共有", `+${TICKET_RULES.share}`]].map(([l, v]) => (
              <div key={l} className="bg-white/15 rounded-2xl py-2"><p className="text-[10.5px] font-bold opacity-90">{l}</p><p className="font-head font-black text-[15px]">{v}枚</p></div>
            ))}
          </div>
          {onEarn && <button onClick={onEarn} className="w-full bg-white text-brand-deep font-black rounded-2xl py-2.5 text-[13.5px] press flex items-center justify-center gap-1"><Icon n="forum" size={18} />後輩の質問に答えてチケットを集める</button>}
        </div>
      );
    }

    function KakomonTab({ items, tickets, courseFilter, setCourseFilter, onOpen, onShare, onEarn }) {
      const courses = Array.from(new Set(items.map(k => k.course)));
      const list = items.filter(k => !courseFilter || k.course === courseFilter);
      return (
        <div className="space-y-5 animate-fade-in">
          <div className="px-1">
            <h1 className="font-head font-black text-[22px]">過去問ライブラリ</h1>
            <p className="text-[12.5px] text-sub leading-relaxed">先輩が共有した過去問・出題傾向。チケット1枚で1件ずっと見られます。</p>
          </div>
          <TicketCard tickets={tickets} onEarn={onEarn} />
          <ScrollRow className="flex gap-2 overflow-x-auto scrollbar-none -mx-4 px-4">
            <button onClick={() => setCourseFilter("")} aria-pressed={!courseFilter} className={CHIP(!courseFilter)}>すべての授業</button>
            {courses.map(c => <button key={c} onClick={() => setCourseFilter(courseFilter === c ? "" : c)} aria-pressed={courseFilter === c} className={CHIP(courseFilter === c)}>{c}</button>)}
          </ScrollRow>
          {courseFilter && (
            <button onClick={() => setCourseFilter("")} className="text-[12px] font-bold text-brand-deep flex items-center gap-0.5 press -mt-3 px-1"><Icon n="close" size={15} />絞り込みを解除</button>
          )}
          <div className="space-y-2.5">
            {list.map(k => (
              <button key={k.id} onClick={() => onOpen(k)} className="w-full text-left bg-surface rounded-3xl border border-line/70 shadow-soft p-4 flex items-center gap-3 press">
                <span className={cx("w-12 h-14 rounded-xl flex items-center justify-center flex-shrink-0 border", k.unlocked ? "bg-brand-tint text-brand-deep border-brand/30" : "bg-sunk text-mute border-line")}>
                  <Icon n={k.unlocked ? "description" : "lock"} fill size={24} />
                </span>
                <span className="flex-1 min-w-0">
                  <span className="block text-[11.5px] font-bold text-brand-deep">{k.course}</span>
                  <span className="block font-head font-bold text-[15px] leading-snug truncate">{k.title}</span>
                  <span className="flex items-center gap-2 text-[11.5px] text-mute mt-0.5">
                    <span>{k.kind}</span><span>{displayName(k.by)}</span>
                    <span className="flex items-center gap-0.5"><Icon n="favorite" fill size={12} className="text-love" />{k.thanks}</span>
                  </span>
