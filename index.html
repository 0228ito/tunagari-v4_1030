        setEventCreate(false);
        setEventsOpen(true);
        showToast(v.scheduled ? "イベントを公開しました" : "仲間を募集しました");
        later(() => {
          setEvents(prev => prev.map(e => e.id === id ? { ...e, interested: e.interested + 1, joiners: [...(e.joiners || []), { id: `d${Date.now()}`, who: "匿名・1年", note: "参加したいです！" }] } : e));
          pushNotice({ kind: "event", title: v.title, preview: "あなたのイベントに「参加したい」が届きました（相手への連絡は主催者から）" });
        }, DEMO_REPLY_MS);
      };
      const onConnected = (p) => {
        setConnections(prev => prev.some(x => x.id === p.id) ? prev : [{ ...p, at: Date.now() }, ...prev]);
      };
      const toggleThanks = (postId, cid) => updatePost(postId, p => ({
        ...p, comments: p.comments.map(c => c.id === cid ? { ...c, liked: !c.liked, thanks: (c.thanks || 0) + (c.liked ? -1 : 1) } : c)
      }));
      const pickBest = (postId, cid, msg) => {
        updatePost(postId, p => ({ ...p, bestAnswerId: cid, bestThanks: msg }));
        showToast("解決済みにしました");
      };
      const closeRecruit = (postId) => { updatePost(postId, p => ({ ...p, closed: true })); showToast("募集を締め切りました"); };

      // ---- 質問する ----
      const submitQuestion = ({ title, category, askTo, content, anon }) => {
        const id = Date.now();
        const post = { id, category, askTo, title, content, author: myUser(anon), at: Date.now(), views: 0, watchers: 0, watched: true, comments: [], joiners: [], hidden: false, closed: false };
        setPosts(prev => [post, ...prev]);
        setAsk(null);
        setTab("home"); setQuery(""); setCatFilter(""); window.scrollTo(0, 0);
        showToast(category === "仲間募集" ? "募集しました" : "質問しました。回答はお知らせに届きます");
        later(() => deliverDemoReply(id, "answer"), DEMO_REPLY_MS);
      };
      const joinQuestion = (postId, note, anon) => {
        updatePost(postId, p => ({ ...p, watched: true, joiners: [...p.joiners, { id: `j${Date.now()}`, who: myUser(anon), note, mine: true }] }));
        setAsk(null);
        openPost(postId);
        showToast("一緒に回答を待ちます");
        later(() => deliverDemoReply(postId, "join"), DEMO_REPLY_MS);
      };

      // ---- 通報 ----
      const submitReport = (reason) => {
        const t = reportTarget;
        setReportTarget(null);
        if (t.summary) { showToast("報告を受け付けました。要約を見直します"); return; }
        if (t.eventId) { setEvents(prev => prev.filter(e => e.id !== t.eventId)); setEventId(null); showToast("通報を受け付けました。運営が確認します"); return; }
        if (t.commentId) setReported(prev => [...prev, `c:${t.postId}:${t.commentId}`]);
        else { updatePost(t.postId, p => ({ ...p, hidden: true })); setSelectedPostId(null); }
        showToast("通報を受け付けました。運営が確認します");
      };

      // ---- 過去問 ----
      const unlockKakomon = (kid) => {
        if (tickets < 1) return;
        setTickets(t => t - 1);
        setKakomon(prev => prev.map(k => k.id === kid ? { ...k, unlocked: true, views: k.views + 1 } : k));
        showToast("チケットを1枚使いました");
      };
      const shareKakomon = ({ course, title, kind, memo }) => {
        const item = { id: `k${Date.now()}`, course, title, kind, memo, by: myUser(me.anonDefault), thanks: 0, views: 0, unlocked: true, mine: true, lines: ["（あなたが共有した内容がここに表示されます）"] };
        setKakomon(prev => [item, ...prev]);
        setTickets(t => t + TICKET_RULES.share);
        setShareOpen(false);
        showToast(`共有ありがとう！チケット+${TICKET_RULES.share}枚`);
        pushNotice({ kind: "ticket", title: `閲覧チケット+${TICKET_RULES.share}枚`, preview: `【${course}】を共有してくれたお礼です` });
      };
      const kakomonThanks = (kid) => setKakomon(prev => prev.map(k => k.id === kid ? { ...k, liked: true, thanks: k.thanks + 1 } : k));
      const kakomonCount = (course) => kakomon.filter(k => k.course === course).length;
      const openKakomonOf = (course) => { setSelectedPostId(null); setKakomonCourse(course); setTab("kakomon"); window.scrollTo(0, 0); };
      const goEarn = () => { setKakomonId(null); setSelectedPostId(null); setTab("home"); setQuery(""); setCatFilter(""); setScope("forYou"); setTimeout(() => { const el = document.getElementById("waiting"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }, 80); };

      // ---- お知らせ ----
      const openNotice = (n) => {
        setNotices(prev => prev.map(x => x.id === n.id ? { ...x, read: true } : x));
        if (n.postId && posts.some(p => p.id === n.postId)) openPost(n.postId);
        else if (n.kind === "ticket") setTab("kakomon");
      };

      // ---- ホームの並び ----
      const isForMe = (p) => catMeta(p.category).grades.includes(me.grade) || (p.askTo === "senpai" && p.author.grade < me.grade && !p.author.mine);
      const termScore = (p) => termMeta.topics.some(t => (t.cat && t.cat === p.category) || (t.q && matchPost(p, [t.q]))) ? 1 : 0;
      const popularity = (p) => p.watchers + p.comments.reduce((a, c) => a + (c.thanks || 0), 0);
      const tokens = parseQuery(query);
      const searching = tokens.length > 0 || !!catFilter;
      const results = visiblePosts
        .filter(p => (!catFilter || p.category === catFilter) && (tokens.length === 0 || matchPost(p, tokens)))
        .sort((a, b) => sort === "popular" ? popularity(b) - popularity(a) : b.at - a.at);
      const odaiNow = visiblePosts.find(p => p.odai && p.odai.current && p.odai.term === term);
      const qPosts = visiblePosts.filter(p => !p.odai);
      const feed = qPosts
        .filter(p => scope === "all" || isForMe(p) || p.author.mine)
        .sort((a, b) => sort === "popular" ? popularity(b) - popularity(a) : (scope === "forYou" ? (termScore(b) - termScore(a)) : 0) || (b.at - a.at));
      const waiting = qPosts
        .filter(p => !p.author.mine && !p.bestAnswerId && !p.closed && p.category !== "仲間募集" && p.comments.length < 3 && (me.grade === 1 ? true : p.author.grade < me.grade))
        .sort((a, b) => a.comments.length - b.comments.length || b.at - a.at);
      // 先輩のハック：生活ハックの質問＋知恵系のお題（お題で集めた知恵を、新入生がずっと参照できるように）
      const hacks = visiblePosts.filter(p => ((p.category === "生活ハック" && !p.odai) || (p.odai && p.odai.kind === "知恵")) && p.comments.length >= 2 && !p.author.mine).sort((a, b) => popularity(b) - popularity(a)).slice(0, 3);
      const upcoming = [...events].sort((a, b) => a.start - b.start).slice(0, 4);
      // シンプル版ホーム：1つの一覧に「回答待ち（最大2件）→ よく読まれている質問」の順で並べる
      const HOME_CATS = ["授業・過去問", "履修・楽単", "生活ハック", "ゼミ・研究室", "暮らし・通学"];
      const waitTop = waiting.filter(p => scope === "all" || isForMe(p)).slice(0, 2);
      const rest = feed.filter(p => !waitTop.includes(p) && p.category !== "仲間募集").sort((a, b) => scope === "forYou" ? (termScore(b) - termScore(a)) || (popularity(b) - popularity(a)) : b.at - a.at).slice(0, 6);
      const restH = rest.map((p, i) => i === 0 ? { ...p, __restHead: true } : p);
      const waitH = waitTop.map((p, i) => i === 0 ? { ...p, __answerHead: true } : p);
      // 1年生：まず「答えが付いている質問」で価値を見せる（回答待ちは3件目の後）。上級生：回答待ちを先頭に
      const homeFeed = me.grade === 1 ? [...restH.slice(0, 3), ...waitH, ...restH.slice(3)] : [...waitH, ...restH];
      const odaiSlot = Math.min(homeFeed.length - 1, me.grade === 1 ? 1 : waitTop.length + 1);
      const openGathers = events.filter(e => !e.closed);

      // ------------------------------------------------------------
      if (stage === "gate") return <GateScreen onEnter={() => setStage("onboard")} />;
      if (stage === "onboard") return <OnboardingScreen onDone={(v) => { setMe(v); setStage("app"); window.scrollTo(0, 0); }} />;

      return (
        <div className="w-full max-w-md mx-auto min-h-screen bg-bg text-ink relative overflow-x-hidden">
          {/* ヘッダー（ロゴを押すとホームに戻る） */}
          <header className="sticky top-0 z-20 bg-bg/95 backdrop-blur px-4 pb-2.5 flex items-center gap-2.5" style={{ paddingTop: "max(0.75rem, env(safe-area-inset-top))" }}>
            <button onClick={goHome} className="flex items-center gap-2 min-w-0 flex-1 text-left press" aria-label="ホームに戻る">
              <img src={LOGO_MARK} alt="" className="w-9 h-9 flex-shrink-0" />
              <span className="min-w-0">
                <span className="block font-head font-black text-[16px] leading-tight">TUNAGARI</span>
                <span className="block text-[11.5px] text-sub truncate flex items-center gap-0.5"><Icon n="verified" fill size={13} className="text-brand-deep" />{U.short}生限定のQ&A</span>
              </span>
            </button>
            {/* シンプル版：ヘッダーはメニューだけ（チケットは過去問タブ、QRはマイページへ） */}
            <button onClick={() => setMenuOpen(true)} aria-label="設定" className="w-9 h-9 rounded-full bg-surface border border-line flex items-center justify-center press"><Icon n="menu" size={20} /></button>
          </header>

          <main className="px-4 pt-1" style={{ paddingBottom: "calc(7rem + env(safe-area-inset-bottom))" }}>
            {tab === "home" && (
              <div className="space-y-5">
                {/* ① 一言＋検索＋聞くボタン（ホームでやること＝探す・聞く） */}
                {!searching && (
                  <div className="pt-2 space-y-1 animate-fade-up">
                    <h1 className="font-head font-black text-[22px] leading-tight">{U.short}のことは、<span className="text-brand-deep">先輩に聞こう。</span></h1>
                    <p className="text-[12.5px] text-sub">過去問・授業のリアル・ゼミのこと。{U.short}生だけが見られる、匿名OKのQ&A</p>
                  </div>
                )}
                <div className="space-y-2.5">
                  <div className="relative">
                    <Icon n="search" size={22} className="absolute left-4 top-1/2 -translate-y-1/2 text-mute" />
                    <input type="text" enterKeyHint="search" aria-label="質問を探す" value={query} onChange={(e) => setQuery(e.target.value)} placeholder="授業名・キーワードで探す"
                      className="w-full bg-surface border border-line/80 rounded-full pl-12 pr-11 py-3 text-[14px] outline-none focus:border-brand shadow-soft" />
                    {query && <button onClick={() => setQuery("")} aria-label="検索をクリア" className="absolute right-2.5 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-sunk text-sub flex items-center justify-center press"><Icon n="close" size={18} /></button>}
                  </div>
                  {!searching && (<>
                    {/* 時期の話題は、検索の候補として出す */}
                    <ScrollRow className="flex gap-1.5 overflow-x-auto scrollbar-none -mx-4 px-4 items-center">
                      <span className="text-[11.5px] font-bold text-mute flex-shrink-0 flex items-center gap-0.5"><Icon n={termMeta.icon} size={14} />{term}のいま</span>
                      {termMeta.topics.map(t => (
                        <button key={t.label} onClick={() => { if (t.cat) setCatFilter(t.cat); else setQuery(t.q); }} className="bg-sunk text-ink text-[12px] font-bold px-2.5 py-1 rounded-full press flex-shrink-0">{t.label}</button>
                      ))}
                    </ScrollRow>
                    <button onClick={() => setAsk({})} className={cx(BTN_PRIMARY, "w-full flex items-center justify-center gap-1.5")}>
                      <Icon n="help" fill size={20} />先輩に質問する
                    </button>
                  </>)}
                </div>

                {searching ? (
                  /* 🔎 検索・絞り込みの結果（ホームへの戻り方・解除をはっきり） */
                  <div className="space-y-3 animate-fade-in">
                    <ScrollRow className="flex gap-2 overflow-x-auto scrollbar-none -mx-4 px-4">
                      <button onClick={() => setCatFilter("")} aria-pressed={!catFilter} className={CHIP(!catFilter)}>すべて</button>
                      {CATEGORIES.map(c => (
                        <button key={c.key} onClick={() => setCatFilter(catFilter === c.key ? "" : c.key)} aria-pressed={catFilter === c.key} className={CHIP(catFilter === c.key)}>
                          <Icon n={c.icon} fill={catFilter === c.key} size={15} />{c.short}
                        </button>
                      ))}
                    </ScrollRow>
                    <div className="flex items-center gap-2 flex-wrap">
                      <button onClick={goHome} className="flex items-center gap-0.5 text-[13px] font-black text-ink press"><Icon n="arrow_back_ios_new" size={16} />ホーム</button>
                      <span className="text-[12px] text-sub flex-1">{results.length}件{catFilter && `・${catMeta(catFilter).short}`}{tokens.length > 0 && `・「${query.trim()}」`}</span>
                      <button onClick={() => { setQuery(""); setCatFilter(""); }} className="text-[12px] font-bold text-brand-deep border border-brand/50 rounded-full px-3 py-1 flex items-center gap-0.5 press"><Icon n="close" size={14} />絞り込みを解除</button>
                    </div>
                    <Segmented value={sort} onChange={setSort} options={[{ value: "new", label: "新着", icon: "schedule" }, { value: "popular", label: "人気", icon: "favorite" }]} />
                    {results.length === 0
                      ? <EmptyState text="見つかりませんでした。質問してみませんか？" action="この内容で質問する" onAction={() => setAsk({ cat: catFilter || undefined })} />
                      : results.map(p => <QuestionRow key={p.id} post={p} tokens={tokens} showTop unread={unreadPostIds.has(p.id)} onOpen={() => openPost(p.id)} onWatch={toggleWatch} />)}
                  </div>
                ) : (
                  <>
                    {/* ② あなた向けの質問（回答待ち・先輩のハック・みんなの質問を1つの一覧に） */}
                    <section className="space-y-3">
                      <div className="flex items-end justify-between gap-2 px-1">
                        <h2 className="font-head font-black text-[17px]">{scope === "forYou" ? `${gradeLabel(me.grade)}生のあなた向け` : "すべての質問"}</h2>
                        <div className="flex gap-0.5 bg-sunk rounded-full p-0.5" role="tablist" aria-label="表示する質問">
                          {[["forYou", "あなた向け"], ["all", "すべて"]].map(([v, l]) => (
                            <button key={v} role="tab" aria-selected={scope === v} onClick={() => setScope(v)} className={cx("text-[11.5px] font-bold px-2.5 py-1 rounded-full press", scope === v ? "bg-surface text-ink shadow-soft" : "text-sub")}>{l}</button>
                          ))}
                        </div>
                      </div>
                      {/* カテゴリは5つ＋「もっと」 */}
                      <div className={cx("flex gap-2", moreCats ? "flex-wrap" : "overflow-x-auto scrollbar-none -mx-4 px-4")}>
                        {(moreCats ? CATEGORIES.map(c => c.key) : HOME_CATS).map(k => (
                          <button key={k} onClick={() => setCatFilter(k)} className={CHIP(false)}><Icon n={catMeta(k).icon} size={15} />{catMeta(k).short}</button>
                        ))}
                        <button onClick={() => setMoreCats(!moreCats)} aria-expanded={moreCats} className={CHIP(false)}><Icon n={moreCats ? "expand_less" : "more_horiz"} size={15} />{moreCats ? "閉じる" : "もっと"}</button>
                      </div>

                      {homeFeed.map((p, i) => (
                        <React.Fragment key={p.id}>
                          {p.__answerHead && <p className="text-[12px] font-black text-brand-deep flex items-center gap-1 px-1 pt-1"><Icon n="forum" size={15} />{me.grade === 1 ? "回答を待っています。知っていたら教えてあげよう" : `後輩が回答を待っています（回答でチケット+${TICKET_RULES.answer}）`}</p>}
                          {p.__restHead && <p className="text-[12px] font-black text-sub flex items-center gap-1 px-1 pt-2"><Icon n="auto_awesome" size={15} />{scope === "forYou" ? `${term}・${gradeLabel(me.grade)}生によく読まれている質問` : "新着の質問"}</p>}
                          <QuestionRow post={p} showTop unread={unreadPostIds.has(p.id)} onOpen={() => openPost(p.id)} onWatch={toggleWatch} />
                          {/* ③ 今週のお題は一覧の途中に1枚だけ */}
                          {i === odaiSlot && odaiNow && (
                            <button onClick={() => openPost(odaiNow.id)} className="w-full text-left bg-brand text-on-brand rounded-3xl p-4 shadow-soft space-y-1.5 press"
                              style={{ backgroundImage: "radial-gradient(rgb(255 255 255 / .12) 1px, transparent 1px)", backgroundSize: "14px 14px" }}>
                              <span className="font-head font-black text-[13px] flex items-center gap-1"><Icon n="campaign" fill size={17} />今週のお題<span className="ml-auto text-[11px] font-bold opacity-90">{odaiNow.comments.length}ペタ</span></span>
                              <p className="font-head font-black text-[15.5px] leading-snug">{odaiNow.title}</p>
                              <p className="text-[12px] font-bold opacity-95">{me.grade === 1 ? "先輩の答えをチェックしよう" : "あなたの経験を、後輩に教えてください"}{odaiNow.comments.some(c => c.user.mine) ? "（ペタ済み）" : ""}</p>
                            </button>
                          )}
                          {i === odaiSlot && odaiNow && <button onClick={() => setCatFilter("運営のお題")} className="-mt-1.5 text-[12px] font-bold text-brand-deep flex items-center press px-1">これまでのお題を見る<Icon n="chevron_right" size={16} /></button>}
                        </React.Fragment>
                      ))}
                      {homeFeed.length === 0 && <EmptyState text="まだ質問がありません" action="最初の質問をする" onAction={() => setAsk({})} />}
                      <button onClick={() => setScope(scope === "forYou" ? "all" : "forYou")} className={cx(BTN_SOFT, "w-full text-[13px]")}>{scope === "forYou" ? "すべての学年の質問を見る" : "あなた向けに戻す"}</button>
                    </section>

                    {/* ④ 仲間・イベント・大学からは、1行の入口だけ */}
                    <button onClick={() => setEventsOpen(true)} className="w-full text-left bg-surface rounded-3xl border border-line/70 shadow-soft p-4 flex items-center gap-3 press">
                      <span className="w-11 h-11 rounded-2xl bg-brand-tint text-brand-deep flex items-center justify-center flex-shrink-0"><Icon n="diversity_3" fill size={24} /></span>
                      <span className="flex-1 min-w-0">
                        <span className="block font-head font-black text-[15px]">仲間・イベント</span>
                        <span className="block text-[12px] text-sub truncate">募集中 {openGathers.length}件・大学から {promos.length}件</span>
                      </span>
                      <Icon n="chevron_right" className="text-mute" />
                    </button>
                  </>
                )}
              </div>
            )}

            {tab === "kakomon" && (
              <KakomonTab items={kakomon} tickets={tickets} courseFilter={kakomonCourse} setCourseFilter={setKakomonCourse}
                onOpen={(k) => setKakomonId(k.id)} onShare={() => setShareOpen(true)} onEarn={goEarn} />
            )}

            {tab === "notices" && (
              <NoticesTab notices={notices} onOpen={openNotice} onReadAll={() => setNotices(prev => prev.map(n => ({ ...n, read: true })))} />
            )}

            {tab === "me" && (
              <MyPageTab me={me} posts={visiblePosts} tickets={tickets} profile={profile} connections={connections} events={events}
                onConnect={() => setConnectOpen(true)} onEditConnectProfile={() => setProfileEdit(true)} onViewProfile={setViewProfile} onOpenEvent={setEventId} onOpen={openPost} onWatch={toggleWatch}
                onEditProfile={() => setProfileOpen(true)} onOpenMenu={() => setMenuOpen(true)} onGoKakomon={() => setTab("kakomon")} />
            )}
          </main>

          {/* 下部ナビ（どの画面からでもホームへ） */}
          <nav className="fixed left-0 right-0 mx-auto w-[calc(100%-1.5rem)] max-w-[26rem] glass rounded-full shadow-lift flex justify-around items-center p-1.5 z-30" style={{ bottom: "max(0.75rem, env(safe-area-inset-bottom))" }}>
            {[
              { tab: "home", icon: "home", label: "ホーム" },
              { tab: "kakomon", icon: "description", label: "過去問" },
              { center: true },
              { tab: "notices", icon: "notifications", label: "お知らせ" },
              { tab: "me", icon: "person", label: "マイページ" }
            ].map(item => item.center ? (
              <div key="center" className="w-[72px] flex-shrink-0 self-stretch relative">
                <button onClick={() => setAsk({})} aria-label="投稿する（質問・仲間・イベント・過去問）"
                  className="absolute left-1/2 -top-8 w-[66px] h-[66px] rounded-full text-on-brand flex flex-col items-center justify-center gap-0.5 press"
                  style={{ transform: "translateX(-50%)", background: "rgb(var(--brand))", boxShadow: "0 0 0 5px rgb(var(--bg)), 0 10px 20px -10px rgb(0 0 0 / .35)" }}>
                  <Icon n="add" size={30} /><span className="text-[12px] font-black leading-none">投稿</span>
                </button>
              </div>
            ) : (
              <button key={item.tab} onClick={() => { if (item.tab === "home") goHome(); else { setTab(item.tab); window.scrollTo(0, 0); } }} aria-label={item.tab === "notices" && unreadCount > 0 ? `お知らせ（未読${unreadCount}件）` : item.label} aria-current={tab === item.tab ? "page" : undefined}
                className={cx("flex flex-col items-center gap-0.5 py-1.5 px-1.5 rounded-full min-w-[58px] press", tab === item.tab ? "text-brand-deep font-black" : "text-mute font-bold")}>
                <span className="relative">
                  <Icon n={item.icon} fill={tab === item.tab} size={24} />
                  {item.tab === "notices" && unreadCount > 0 && <span className="absolute -top-1.5 -right-2.5 min-w-[18px] h-[18px] px-1 rounded-full bg-love text-white text-[10px] font-black flex items-center justify-center ring-2 ring-surface">{unreadCount}</span>}
                </span>
                <span className="text-[10.5px] leading-none whitespace-nowrap">{item.label}</span>
              </button>
            ))}
          </nav>

          {toast && (
            <div role="status" className="fixed left-1/2 glass text-ink text-[13px] px-4 py-2.5 rounded-full shadow-lift z-[80] animate-pop font-bold w-max max-w-[88vw] text-center" style={{ top: "max(4.5rem, calc(env(safe-area-inset-top) + 3.5rem))" }}>{toast}</div>
          )}

          {selectedPost && (
            <PostDetailSheet key={selectedPost.id} post={selectedPost} me={me} reported={reported} kakomonCount={kakomonCount} myPetaName={me.petaAnon === false ? (profile.nick || "ニックネーム未設定") : displayName({ fac: facShort(me.faculty), grade: me.grade, anon: true })}
              onClose={() => setSelectedPostId(null)} onWatch={toggleWatch} onAnswer={addAnswer} onThanks={toggleThanks}
              onPickBest={pickBest} onCloseRecruit={closeRecruit} onReport={setReportTarget}
              onDemoAnswer={(id) => deliverDemoReply(id, "answer")} onOpenKakomon={openKakomonOf} />
          )}
          {ask && (
            <AskSheet me={me} posts={visiblePosts} preset={ask} onClose={() => setAsk(null)} onSubmit={submitQuestion}
              onJoin={joinQuestion} onOpenPost={(id) => { setAsk(null); openPost(id); }} onCreateEvent={() => { setAsk(null); setEventCreate(true); }} onShareKakomon={() => { setAsk(null); setShareOpen(true); }} />
          )}
          {ticketIntro && (
            <Dialog onClose={() => setTicketIntro(false)} z={75}>
              <div className="p-6 space-y-4 text-center">
                <Icon n="confirmation_number" fill size={48} className="text-brand" />
                <div className="space-y-1.5">
                  <h3 className="font-head font-black text-[18px]">閲覧チケットをもらいました</h3>
                  <p className="text-[13.5px] text-sub leading-relaxed">回答してくれたお礼です。<br />チケット1枚で、先輩が共有した過去問を1件ずっと見られます。</p>
                </div>
                <div className="flex gap-2">
                  <button onClick={() => setTicketIntro(false)} className={cx(BTN_SOFT, "flex-1")}>あとで</button>
                  <button onClick={() => { setTicketIntro(false); setSelectedPostId(null); setTab("kakomon"); window.scrollTo(0, 0); }} className={cx(BTN_PRIMARY, "flex-[2] text-[14px]")}>過去問を見る</button>
                </div>
              </div>
            </Dialog>
          )}
          {reportTarget && <ReportDialog target={reportTarget} onClose={() => setReportTarget(null)} onSubmit={submitReport} />}
          {kakomonId && (() => {
            const item = kakomon.find(k => k.id === kakomonId);
            return item ? <KakomonSheet item={item} tickets={tickets} onClose={() => setKakomonId(null)} onUnlock={unlockKakomon} onThanks={kakomonThanks} onEarn={goEarn} /> : null;
          })()}
          {shareOpen && <ShareKakomonSheet onClose={() => setShareOpen(false)} onSubmit={shareKakomon} />}
          {eventsOpen && (
            <EventsPage events={events} promos={promos} me={me} onBack={() => setEventsOpen(false)}
              onOpenEvent={setEventId} onOpenPromo={setPromoId} onCreate={() => setEventCreate(true)} />
          )}
          {eventId && (() => { const ev = events.find(e => e.id === eventId); return ev ? <EventSheet ev={ev} onClose={() => setEventId(null)} onInterest={toggleInterest} onCloseGather={closeGather} onReport={(id) => setReportTarget({ eventId: id })} /> : null; })()}
          {promoId && <PromoSheet promo={promos.find(p => p.id === promoId)} onClose={() => setPromoId(null)} showToast={showToast} />}
          {eventCreate && <EventCreateSheet nick={profile.nick} onClose={() => setEventCreate(false)} onSubmit={createEvent} />}
          {connectOpen && <ConnectSheet profile={profile} onClose={() => setConnectOpen(false)} onConnected={onConnected} />}
          {profileEdit && <ProfileEditSheet profile={profile} onClose={() => setProfileEdit(false)} onSave={(p) => { setProfile(p); setProfileEdit(false); showToast("保存しました"); }} />}
          {viewProfile && (
            <Sheet onClose={() => setViewProfile(null)} z={58}>
              <SheetHeader title="プロフィール" icon="badge" onClose={() => setViewProfile(null)} />
              <div className="px-5 pb-6 pt-1 overflow-y-auto"><ProfileCard p={viewProfile} common={commonOf(profile, viewProfile)} /></div>
            </Sheet>
          )}
          {menuOpen && (
            <MenuPage me={me} termMode={termMode} setTermMode={setTermMode} notif={notif} setNotif={setNotif}
              onClose={() => setMenuOpen(false)} onEditProfile={() => setProfileOpen(true)}
              onLogout={() => { setMenuOpen(false); setStage("gate"); setTab("home"); }} />
          )}
          {profileOpen && (
            <Sheet onClose={() => setProfileOpen(false)} z={60}>
              <SheetHeader title="学部・学年・匿名の設定" icon="badge" onClose={() => setProfileOpen(false)} />
              <div className="px-5 pb-6 pt-1 overflow-y-auto">
                <ProfileForm initial={me} showPeta saveLabel="保存する" onSave={(v) => { setMe(v); setProfileOpen(false); showToast("保存しました"); }} />
              </div>
            </Sheet>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);

    // 📱 PWA：サービスワーカーの登録（https か localhost で開いたときだけ）
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); });
    }
  </script>
</body>
</html>
