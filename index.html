    // 🏠 アプリ本体
    // ============================================================
    const DEMO_REPLIES = [
      { user: () => usr(P(2), 3), text: "去年同じことで悩みました。まず同じ授業を取っていた先輩に聞くのが一番早かったです。" },
      { user: () => usr(P(1), 4, true), text: "時期によって変わるので、最新の情報はここで聞くのが確実だと思います。自分のときは早めに動いて正解でした。" },
      { user: () => usr(P(3), 2), text: "私も気になっていました！わかったことがあれば追記します。" }
    ];

    function App() {
      const [stage, setStage] = useState("gate");          // gate → onboard → app
      const [me, setMe] = useState({ faculty: U.defaultFaculty, grade: 1, anonDefault: true });
      const [posts, setPosts] = useState(() => makeInitialPosts());
      const [kakomon, setKakomon] = useState(() => makeInitialKakomon());
      const [notices, setNotices] = useState(() => makeInitialNotices());
      const [tickets, setTickets] = useState(START_TICKETS);
      const [tab, setTab] = useState("home");
      const [scope, setScope] = useState("forYou");         // forYou | all
      const [sort, setSort] = useState("new");
      const [query, setQuery] = useState("");
      const [catFilter, setCatFilter] = useState("");
      const [termMode, setTermMode] = useState("auto");
      const [notif, setNotif] = useState({});
      const [selectedPostId, setSelectedPostId] = useState(null);
      const [ask, setAsk] = useState(null);                 // null | { tpl?, cat? }
      const [reportTarget, setReportTarget] = useState(null);
      const [reported, setReported] = useState([]);
      const [kakomonId, setKakomonId] = useState(null);
      const [kakomonCourse, setKakomonCourse] = useState("");
      const [shareOpen, setShareOpen] = useState(false);
      const [menuOpen, setMenuOpen] = useState(false);
      const [profileOpen, setProfileOpen] = useState(false);
      const [toast, setToast] = useState(null);
      const [bannerOff, setBannerOff] = useState(false);
      const timers = useRef([]);
      const postsRef = useRef(posts);
      postsRef.current = posts;
      const toastTimer = useRef(null);
      useEffect(() => () => timers.current.forEach(clearTimeout), []);
      const later = (fn, ms) => { timers.current.push(setTimeout(fn, ms)); };

      const term = termMode === "auto" ? autoTerm() : termMode;
      const termMeta = TERM_META[term];
      const myUser = (anon) => ({ fac: facShort(me.faculty), grade: me.grade, anon, mine: true });
      const selectedPost = posts.find(p => p.id === selectedPostId) || null;
      const visiblePosts = posts.filter(p => !p.hidden);
      const unreadCount = notices.filter(n => !n.read).length;
      const unreadPostIds = new Set(notices.filter(n => !n.read && n.postId).map(n => n.postId));

      const showToast = (m) => { setToast(m); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(() => setToast(null), 2600); };
      const pushNotice = (n) => { if (notif[n.kind === "join" ? "watch" : n.kind] === false) return; setNotices(prev => [{ id: `n${Date.now()}${Math.random()}`, at: Date.now(), read: false, ...n }, ...prev]); };
      const updatePost = (id, fn) => setPosts(prev => prev.map(p => p.id === id ? fn(p) : p));
      const goHome = () => { setTab("home"); setQuery(""); setCatFilter(""); window.scrollTo({ top: 0, behavior: "smooth" }); };
      const openPost = (id) => {
        setSelectedPostId(id);
        updatePost(id, p => ({ ...p, views: p.views + 1 }));
        setNotices(prev => prev.map(n => n.postId === id ? { ...n, read: true } : n));
      };

      // ---- 回答が届く（デモ） ----
      const deliverDemoReply = (postId, kind) => {
        const r = DEMO_REPLIES[Math.floor(Math.random() * DEMO_REPLIES.length)];
        const c = { id: Date.now() + Math.floor(Math.random() * 1000), user: r.user(), text: r.text, at: Date.now(), thanks: 0, liked: false };
        const cur = postsRef.current.find(p => p.id === postId);
        if (!cur || cur.bestAnswerId || cur.closed || cur.hidden) return;
        setPosts(prev => prev.map(p => p.id === postId ? { ...p, comments: [...p.comments, c] } : p));
        pushNotice({ kind, postId, title: shortTitle(cur.title), preview: c.text });
      };

      // ---- 気になる ----
      const toggleWatch = (id) => {
        const p = posts.find(x => x.id === id);
        if (!p) return;
        const on = !p.watched;
        updatePost(id, x => ({ ...x, watched: on, watchers: x.watchers + (on ? 1 : -1) }));
        if (on) {
          showToast("回答が届いたらお知らせします");
          if (!p.bestAnswerId && !p.closed) later(() => deliverDemoReply(id, "watch"), DEMO_REPLY_MS + 2000);
        }
      };

      // ---- 回答する ----
      const addAnswer = (postId, text, anon) => {
        const p = posts.find(x => x.id === postId);
        const first = !p.comments.some(c => c.user.mine);
        const recruit = p.category === "仲間募集";
        const c = { id: Date.now(), user: myUser(anon), text, at: Date.now(), thanks: 0, liked: false };
        updatePost(postId, x => ({ ...x, comments: [...x.comments, c] }));
        if (first && !recruit) {
          setTickets(t => t + TICKET_RULES.answer);
          showToast(`回答ありがとう！チケット+${TICKET_RULES.answer}枚`);
          pushNotice({ kind: "ticket", title: `閲覧チケット+${TICKET_RULES.answer}枚`, preview: "質問に回答してくれたお礼です。過去問ライブラリで使えます" });
        } else showToast(recruit ? "返信しました" : "回答しました");
        // デモ：少しあとに「助かった！」が届く
        later(() => {
          setPosts(prev => prev.map(x => x.id !== postId ? x : { ...x, comments: x.comments.map(k => k.id === c.id ? { ...k, thanks: (k.thanks || 0) + 1 } : k) }));
          pushNotice({ kind: "thanks", postId, title: shortTitle(p.title), preview: text });
        }, DEMO_THANKS_MS);
      };
      const toggleThanks = (postId, cid) => updatePost(postId, p => ({
        ...p, comments: p.comments.map(c => c.id === cid ? { ...c, liked: !c.liked, thanks: (c.thanks || 0) + (c.liked ? -1 : 1) } : c)
      }));
      const pickBest = (postId, cid, msg) => {
        updatePost(postId, p => ({ ...p, bestAnswerId: cid, bestThanks: msg }));
        showToast("解決済みにしました");
      };
      const closeRecruit = (postId) => { updatePost(postId, p => ({ ...p, closed: true })); showToast("募集を締め切りました"); };

      // ---- 質問する ----
      const submitQuestion = ({ title, category, askTo, content, anon }) => {
        const id = Date.now();
        const post = { id, category, askTo, title, content, author: myUser(anon), at: Date.now(), views: 0, watchers: 0, watched: true, comments: [], joiners: [], hidden: false, closed: false };
        setPosts(prev => [post, ...prev]);
        setAsk(null);
        setTab("home"); setQuery(""); setCatFilter(""); window.scrollTo(0, 0);
        showToast(category === "仲間募集" ? "募集しました" : "質問しました。回答はお知らせに届きます");
        later(() => deliverDemoReply(id, "answer"), DEMO_REPLY_MS);
      };
      const joinQuestion = (postId, note, anon) => {
        updatePost(postId, p => ({ ...p, watched: true, joiners: [...p.joiners, { id: `j${Date.now()}`, who: myUser(anon), note, mine: true }] }));
        setAsk(null);
        openPost(postId);
        showToast("一緒に回答を待ちます");
        later(() => deliverDemoReply(postId, "join"), DEMO_REPLY_MS);
      };

      // ---- 通報 ----
      const submitReport = (reason) => {
        const t = reportTarget;
        setReportTarget(null);
        if (t.summary) { showToast("報告を受け付けました。要約を見直します"); return; }
        if (t.commentId) setReported(prev => [...prev, `c:${t.postId}:${t.commentId}`]);
        else { updatePost(t.postId, p => ({ ...p, hidden: true })); setSelectedPostId(null); }
        showToast("通報を受け付けました。運営が確認します");
      };

      // ---- 過去問 ----
      const unlockKakomon = (kid) => {
        if (tickets < 1) return;
        setTickets(t => t - 1);
        setKakomon(prev => prev.map(k => k.id === kid ? { ...k, unlocked: true, views: k.views + 1 } : k));
        showToast("チケットを1枚使いました");
      };
      const shareKakomon = ({ course, title, kind, memo }) => {
        const item = { id: `k${Date.now()}`, course, title, kind, memo, by: myUser(me.anonDefault), thanks: 0, views: 0, unlocked: true, mine: true, lines: ["（あなたが共有した内容がここに表示されます）"] };
        setKakomon(prev => [item, ...prev]);
        setTickets(t => t + TICKET_RULES.share);
        setShareOpen(false);
        showToast(`共有ありがとう！チケット+${TICKET_RULES.share}枚`);
        pushNotice({ kind: "ticket", title: `閲覧チケット+${TICKET_RULES.share}枚`, preview: `【${course}】を共有してくれたお礼です` });
      };
      const kakomonThanks = (kid) => setKakomon(prev => prev.map(k => k.id === kid ? { ...k, liked: true, thanks: k.thanks + 1 } : k));
      const kakomonCount = (course) => kakomon.filter(k => k.course === course).length;
      const openKakomonOf = (course) => { setSelectedPostId(null); setKakomonCourse(course); setTab("kakomon"); window.scrollTo(0, 0); };
      const goEarn = () => { setKakomonId(null); setSelectedPostId(null); setTab("home"); setQuery(""); setCatFilter(""); setScope("forYou"); setTimeout(() => { const el = document.getElementById("waiting"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }, 80); };

      // ---- お知らせ ----
      const openNotice = (n) => {
        setNotices(prev => prev.map(x => x.id === n.id ? { ...x, read: true } : x));
        if (n.postId && posts.some(p => p.id === n.postId)) openPost(n.postId);
        else if (n.kind === "ticket") setTab("kakomon");
      };

      // ---- ホームの並び ----
      const isForMe = (p) => catMeta(p.category).grades.includes(me.grade) || (p.askTo === "senpai" && p.author.grade < me.grade && !p.author.mine);
      const termScore = (p) => termMeta.topics.some(t => (t.cat && t.cat === p.category) || (t.q && matchPost(p, [t.q]))) ? 1 : 0;
      const popularity = (p) => p.watchers + p.comments.reduce((a, c) => a + (c.thanks || 0), 0);
      const tokens = parseQuery(query);
      const searching = tokens.length > 0 || !!catFilter;
      const results = visiblePosts
        .filter(p => (!catFilter || p.category === catFilter) && (tokens.length === 0 || matchPost(p, tokens)))
        .sort((a, b) => sort === "popular" ? popularity(b) - popularity(a) : b.at - a.at);
      const feed = visiblePosts
        .filter(p => scope === "all" || isForMe(p) || p.author.mine)
        .sort((a, b) => sort === "popular" ? popularity(b) - popularity(a) : (scope === "forYou" ? (termScore(b) - termScore(a)) : 0) || (b.at - a.at));
      const waiting = visiblePosts
        .filter(p => !p.author.mine && !p.bestAnswerId && !p.closed && p.category !== "仲間募集" && p.comments.length < 3 && (me.grade === 1 ? true : p.author.grade < me.grade))
        .sort((a, b) => a.comments.length - b.comments.length || b.at - a.at);
      const hacks = visiblePosts.filter(p => p.category === "生活ハック" && p.comments.length > 0 && !p.author.mine).sort((a, b) => popularity(b) - popularity(a)).slice(0, 3);
      const recruits = visiblePosts.filter(p => p.category === "仲間募集" && !p.closed);

      // ------------------------------------------------------------
      if (stage === "gate") return <GateScreen onEnter={() => setStage("onboard")} />;
      if (stage === "onboard") return <OnboardingScreen onDone={(v) => { setMe(v); setStage("app"); window.scrollTo(0, 0); }} />;

      return (
        <div className="w-full max-w-md mx-auto min-h-screen bg-bg text-ink relative overflow-x-hidden">
          {/* ヘッダー（ロゴを押すとホームに戻る） */}
          <header className="sticky top-0 z-20 bg-bg/95 backdrop-blur px-4 pb-2.5 flex items-center gap-2.5" style={{ paddingTop: "max(0.75rem, env(safe-area-inset-top))" }}>
            <button onClick={goHome} className="flex items-center gap-2 min-w-0 flex-1 text-left press" aria-label="ホームに戻る">
              <img src={LOGO_MARK} alt="" className="w-9 h-9 flex-shrink-0" />
              <span className="min-w-0">
                <span className="block font-head font-black text-[16px] leading-tight">TUNAGARI</span>
                <span className="block text-[11.5px] text-sub truncate flex items-center gap-0.5"><Icon n="verified" fill size={13} className="text-brand-deep" />{U.short}生限定のQ&A</span>
              </span>
            </button>
            <button onClick={() => setTab("kakomon")} className="bg-surface border border-line rounded-full pl-2.5 pr-3 h-9 flex items-center gap-1 text-[13px] font-black press" aria-label={`閲覧チケット ${tickets}枚`}>
              <Icon n="confirmation_number" fill size={18} className="text-brand" />{tickets}
            </button>
            <button onClick={() => setMenuOpen(true)} aria-label="設定" className="w-9 h-9 rounded-full bg-surface border border-line flex items-center justify-center press"><Icon n="menu" size={20} /></button>
          </header>

          <main className="px-4 pt-1" style={{ paddingBottom: "calc(7rem + env(safe-area-inset-bottom))" }}>
            {tab === "home" && (
              <div className="space-y-5">
                {/* 検索（×で消せる） */}
                <div className="relative">
                  <Icon n="search" size={22} className="absolute left-4 top-1/2 -translate-y-1/2 text-mute" />
                  <input type="text" enterKeyHint="search" aria-label="質問を探す" value={query} onChange={(e) => setQuery(e.target.value)} placeholder="授業名・キーワードで探す"
                    className="w-full bg-surface border border-line/80 rounded-full pl-12 pr-11 py-3 text-[14px] outline-none focus:border-brand shadow-soft" />
                  {query && <button onClick={() => setQuery("")} aria-label="検索をクリア" className="absolute right-2.5 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-sunk text-sub flex items-center justify-center press"><Icon n="close" size={18} /></button>}
                </div>

                {/* カテゴリ */}
                <ScrollRow className="flex gap-2 overflow-x-auto scrollbar-none -mx-4 px-4">
                  <button onClick={() => setCatFilter("")} aria-pressed={!catFilter} className={CHIP(!catFilter)}>すべて</button>
                  {CATEGORIES.map(c => (
                    <button key={c.key} onClick={() => setCatFilter(catFilter === c.key ? "" : c.key)} aria-pressed={catFilter === c.key} className={CHIP(catFilter === c.key)}>
                      <Icon n={c.icon} fill={catFilter === c.key} size={15} />{c.short}
                    </button>
                  ))}
                </ScrollRow>

                {searching ? (
                  /* 🔎 検索・絞り込みの結果（ホームへの戻り方・解除をはっきり） */
                  <div className="space-y-3 animate-fade-in">
                    <div className="flex items-center gap-2 flex-wrap">
                      <button onClick={goHome} className="flex items-center gap-0.5 text-[13px] font-black text-ink press"><Icon n="arrow_back_ios_new" size={16} />ホーム</button>
                      <span className="text-[12px] text-sub flex-1">{results.length}件{catFilter && `・${catMeta(catFilter).short}`}{tokens.length > 0 && `・「${query.trim()}」`}</span>
                      <button onClick={() => { setQuery(""); setCatFilter(""); }} className="text-[12px] font-bold text-brand-deep border border-brand/50 rounded-full px-3 py-1 flex items-center gap-0.5 press"><Icon n="close" size={14} />絞り込みを解除</button>
                    </div>
                    <Segmented value={sort} onChange={setSort} options={[{ value: "new", label: "新着", icon: "schedule" }, { value: "popular", label: "人気", icon: "favorite" }]} />
                    {results.length === 0
                      ? <EmptyState text="見つかりませんでした。質問してみませんか？" action="この内容で質問する" onAction={() => setAsk({ cat: catFilter || undefined })} />
                      : results.map(p => <QuestionRow key={p.id} post={p} tokens={tokens} unread={unreadPostIds.has(p.id)} onOpen={() => openPost(p.id)} onWatch={toggleWatch} />)}
                  </div>
                ) : (
                  <>
                    {/* 🗓 前期・後期で切り替わる「いま」の話題 */}
                    <div className="bg-surface rounded-3xl border border-line/70 shadow-soft p-4 space-y-2.5">
                      <div className="flex items-center gap-2">
                        <span className="w-9 h-9 rounded-2xl bg-brand-tint text-brand-deep flex items-center justify-center"><Icon n={termMeta.icon} fill size={20} /></span>
                        <div className="min-w-0">
                          <p className="font-head font-black text-[15px] leading-tight">{gradeLabel(me.grade)}生の{term}、いま気になること</p>
                          <p className="text-[11.5px] text-mute">時期と学年に合わせて自動で切り替わります</p>
                        </div>
                      </div>
                      <div className="flex flex-wrap gap-1.5">
                        {termMeta.topics.map(t => (
                          <button key={t.label} onClick={() => { if (t.cat) setCatFilter(t.cat); else setQuery(t.q); }} className="bg-sunk text-ink text-[12.5px] font-bold px-3 py-1.5 rounded-full press">{t.label}</button>
                        ))}
                      </div>
                    </div>

                    {!bannerOff && (
                      <div className="bg-brand-tint rounded-3xl p-3.5 flex gap-3 items-start animate-fade-up">
                        <Icon n="confirmation_number" fill size={24} className="text-brand-deep flex-shrink-0" />
                        <p className="text-[12.5px] leading-relaxed flex-1"><b className="text-brand-deep">質問に1件答えると、過去問を1件見られます。</b><br /><span className="text-sub">TUNAGARIはずっと無料。知恵をくれた人が得をするしくみです。</span></p>
                        <button onClick={() => setBannerOff(true)} aria-label="閉じる" className="text-mute press"><Icon n="close" size={18} /></button>
                      </div>
                    )}

                    {/* 回答を待っている質問（上級生には「後輩が待っている」） */}
                    {waiting.length > 0 && (
                      <section id="waiting" className="space-y-3 scroll-mt-20">
                        <SectionHead icon="forum" title={me.grade === 1 ? "回答を待っている質問" : "後輩が回答を待っています"}
                          sub={me.grade === 1 ? "知っていることがあれば教えてあげよう" : `あなたの経験が役に立ちます・回答でチケット+${TICKET_RULES.answer}`} />
                        <ScrollRow className="flex gap-3 overflow-x-auto scrollbar-none -mx-4 px-4 pb-1">
                          {waiting.map(p => <QuestionCard key={p.id} post={p} unread={unreadPostIds.has(p.id)} onOpen={() => openPost(p.id)} />)}
                        </ScrollRow>
                      </section>
                    )}

                    {/* 先輩のハック（北大：勉強法・暮らしのノウハウがほしい） */}
                    {hacks.length > 0 && (
                      <section className="space-y-3">
                        <SectionHead icon="lightbulb" title="先輩のハック" sub="勉強法・メール術など、いちばん助かった！が多い答え" action="もっと見る" onAction={() => setCatFilter("生活ハック")} />
                        <div className="space-y-2.5">
                          {hacks.map(p => {
                            const top = [...p.comments].sort((a, b) => (b.thanks || 0) - (a.thanks || 0))[0];
                            return (
                              <button key={p.id} onClick={() => openPost(p.id)} className="w-full text-left bg-surface rounded-3xl border border-line/70 shadow-soft p-4 space-y-2 press">
                                <p className="font-head font-bold text-[15px] leading-snug flex gap-1.5"><span className="text-brand font-black">Q.</span>{plainTitle(p.title)}</p>
                                <div className="bg-sunk rounded-2xl p-3 space-y-1">
                                  <div className="text-[11.5px] font-bold text-sub flex items-center gap-1"><Avatar user={top.user} size={18} />{displayName(top.user)}<span className="ml-auto text-love-ink flex items-center gap-0.5"><Icon n="favorite" fill size={13} />{top.thanks}</span></div>
                                  <p className="text-[13px] leading-relaxed line-clamp-2">{top.text}</p>
                                </div>
                                <p className="text-[12px] text-sub flex items-center gap-1"><Icon n="forum" size={14} />回答 {p.comments.length}件{p.comments.length >= SUMMARY_MIN_ANSWERS && <span className="text-brand-deep font-bold">・AI要約あり</span>}</p>
                              </button>
                            );
                          })}
                        </div>
                      </section>
                    )}

                    {/* 仲間募集（北大：〇〇な人を探していますがほしい） */}
                    <section className="space-y-3">
                      <SectionHead icon="diversity_3" title="仲間募集" sub="一緒にがんばる仲間を学内で探そう" action="募集する" onAction={() => setAsk({ tpl: "buddy" })} />
                      <ScrollRow className="flex gap-3 overflow-x-auto scrollbar-none -mx-4 px-4 pb-1">
                        {recruits.map(p => <QuestionCard key={p.id} post={p} unread={unreadPostIds.has(p.id)} onOpen={() => openPost(p.id)} />)}
                        <button onClick={() => setAsk({ tpl: "buddy" })} className="w-[150px] flex-shrink-0 rounded-3xl border-2 border-dashed border-brand/40 text-brand-deep flex flex-col items-center justify-center gap-1 press">
                          <Icon n="add_circle" fill size={28} /><span className="text-[13px] font-black">仲間を募集する</span>
                        </button>
                      </ScrollRow>
                    </section>

                    {/* 質問の一覧（あなた向け／みんな） */}
                    <section className="space-y-3">
                      <SectionHead icon="help" title="みんなの質問" />
                      <Segmented value={scope} onChange={setScope} options={[{ value: "forYou", label: `あなた向け（${gradeLabel(me.grade)}）`, icon: "person" }, { value: "all", label: "すべての学年", icon: "groups" }]} />
                      <div className="flex justify-end gap-1">
                        {[["new", "新着"], ["popular", "人気"]].map(([v, l]) => (
                          <button key={v} onClick={() => setSort(v)} aria-pressed={sort === v} className={cx("text-[12px] font-bold px-2.5 py-1 rounded-full press", sort === v ? "bg-ink text-bg" : "text-sub")}>{l}</button>
                        ))}
                      </div>
                      {feed.map(p => <QuestionRow key={p.id} post={p} unread={unreadPostIds.has(p.id)} onOpen={() => openPost(p.id)} onWatch={toggleWatch} />)}
                      {feed.length === 0 && <EmptyState text="まだ質問がありません" />}
                    </section>
                  </>
                )}
              </div>
            )}

            {tab === "kakomon" && (
              <KakomonTab items={kakomon} tickets={tickets} courseFilter={kakomonCourse} setCourseFilter={setKakomonCourse}
                onOpen={(k) => setKakomonId(k.id)} onShare={() => setShareOpen(true)} onEarn={goEarn} />
            )}

            {tab === "notices" && (
              <NoticesTab notices={notices} onOpen={openNotice} onReadAll={() => setNotices(prev => prev.map(n => ({ ...n, read: true })))} />
            )}

            {tab === "me" && (
              <MyPageTab me={me} posts={visiblePosts} tickets={tickets} onOpen={openPost} onWatch={toggleWatch}
                onEditProfile={() => setProfileOpen(true)} onOpenMenu={() => setMenuOpen(true)} onGoKakomon={() => setTab("kakomon")} />
            )}
          </main>

          {/* 下部ナビ（どの画面からでもホームへ） */}
          <nav className="fixed left-0 right-0 mx-auto w-[calc(100%-1.5rem)] max-w-[26rem] glass rounded-full shadow-lift flex justify-around items-center p-1.5 z-30" style={{ bottom: "max(0.75rem, env(safe-area-inset-bottom))" }}>
            {[
              { tab: "home", icon: "home", label: "ホーム" },
              { tab: "kakomon", icon: "description", label: "過去問" },
              { center: true },
              { tab: "notices", icon: "notifications", label: "お知らせ" },
              { tab: "me", icon: "person", label: "マイページ" }
            ].map(item => item.center ? (
              <div key="center" className="w-[72px] flex-shrink-0 self-stretch relative">
                <button onClick={() => setAsk({})} aria-label="質問する"
                  className="absolute left-1/2 -top-8 w-[66px] h-[66px] rounded-full text-on-brand flex flex-col items-center justify-center gap-0.5 press"
                  style={{ transform: "translateX(-50%)", background: "rgb(var(--brand))", boxShadow: "0 0 0 5px rgb(var(--bg)), 0 10px 20px -10px rgb(0 0 0 / .35)" }}>
                  <Icon n="help" fill size={26} /><span className="text-[11.5px] font-black leading-none">質問する</span>
                </button>
              </div>
            ) : (
              <button key={item.tab} onClick={() => { if (item.tab === "home") goHome(); else { setTab(item.tab); window.scrollTo(0, 0); } }} aria-label={item.tab === "notices" && unreadCount > 0 ? `お知らせ（未読${unreadCount}件）` : item.label} aria-current={tab === item.tab ? "page" : undefined}
                className={cx("flex flex-col items-center gap-0.5 py-1.5 px-1.5 rounded-full min-w-[58px] press", tab === item.tab ? "text-brand-deep font-black" : "text-mute font-bold")}>
                <span className="relative">
                  <Icon n={item.icon} fill={tab === item.tab} size={24} />
                  {item.tab === "notices" && unreadCount > 0 && <span className="absolute -top-1.5 -right-2.5 min-w-[18px] h-[18px] px-1 rounded-full bg-love text-white text-[10px] font-black flex items-center justify-center ring-2 ring-surface">{unreadCount}</span>}
                </span>
                <span className="text-[10.5px] leading-none whitespace-nowrap">{item.label}</span>
              </button>
            ))}
          </nav>

          {toast && (
            <div role="status" className="fixed left-1/2 glass text-ink text-[13px] px-4 py-2.5 rounded-full shadow-lift z-[80] animate-pop font-bold w-max max-w-[88vw] text-center" style={{ top: "max(4.5rem, calc(env(safe-area-inset-top) + 3.5rem))" }}>{toast}</div>
          )}

          {selectedPost && (
            <PostDetailSheet key={selectedPost.id} post={selectedPost} me={me} reported={reported} kakomonCount={kakomonCount}
              onClose={() => setSelectedPostId(null)} onWatch={toggleWatch} onAnswer={addAnswer} onThanks={toggleThanks}
              onPickBest={pickBest} onCloseRecruit={closeRecruit} onReport={setReportTarget}
              onDemoAnswer={(id) => deliverDemoReply(id, "answer")} onOpenKakomon={openKakomonOf} />
          )}
          {ask && (
            <AskSheet me={me} posts={visiblePosts} preset={ask} onClose={() => setAsk(null)} onSubmit={submitQuestion}
              onJoin={joinQuestion} onOpenPost={(id) => { setAsk(null); openPost(id); }} />
          )}
          {reportTarget && <ReportDialog target={reportTarget} onClose={() => setReportTarget(null)} onSubmit={submitReport} />}
          {kakomonId && (() => {
            const item = kakomon.find(k => k.id === kakomonId);
            return item ? <KakomonSheet item={item} tickets={tickets} onClose={() => setKakomonId(null)} onUnlock={unlockKakomon} onThanks={kakomonThanks} onEarn={goEarn} /> : null;
          })()}
          {shareOpen && <ShareKakomonSheet onClose={() => setShareOpen(false)} onSubmit={shareKakomon} />}
          {menuOpen && (
            <MenuPage me={me} termMode={termMode} setTermMode={setTermMode} notif={notif} setNotif={setNotif}
              onClose={() => setMenuOpen(false)} onEditProfile={() => setProfileOpen(true)}
              onLogout={() => { setMenuOpen(false); setStage("gate"); setTab("home"); }} />
          )}
          {profileOpen && (
            <Sheet onClose={() => setProfileOpen(false)} z={60}>
              <SheetHeader title="学部・学年・匿名の設定" icon="badge" onClose={() => setProfileOpen(false)} />
              <div className="px-5 pb-6 pt-1 overflow-y-auto">
                <ProfileForm initial={me} saveLabel="保存する" onSave={(v) => { setMe(v); setProfileOpen(false); showToast("保存しました"); }} />
              </div>
            </Sheet>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);

    // 📱 PWA：サービスワーカーの登録（https か localhost で開いたときだけ）
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); });
    }
  </script>
</body>
</html>
